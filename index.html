<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>파티 게임 라운지 v2.0</title>

<style>
*{
 box-sizing:border-box;
 font-family:system-ui,-apple-system,"Pretendard",sans-serif
}

body{
 margin:0;
 background:#10131f;
 color:#edf2f7;
 min-height:100vh
}

.app{
 max-width:1160px;
 margin:auto;
 padding:24px
}

header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 background:linear-gradient(110deg,#202a4a,#44235c);
 padding:20px 24px;
 border-radius:20px;
 border:1px solid #7486cf
}

h1{
 margin:0;
 font-size:26px
}

.tag{
 color:#b9c7ff;
 font-size:13px
}

.hidden{
 display:none!important
}

.card{
 background:#181d2e;

 padding:18px

.grid{

 grid-template-columns:250px 1fr 260px;
 gap:14px;

 padding:10px 13px;
 background:#7184e8;

}

 filter:brightness(1.12)
}

button:disabled{
 opacity:.45;
 cursor:not-allowed
}

.danger{

}

.gold{

}

}

input,select,textarea{
 width:100%;

 padding:10px;

 margin:5px 0
}

textarea{

 resize:vertical
}

.list{

 overflow:auto
}

.item{

 border-bottom:1px solid #2b344d;

}

.online{

 height:8px;

 border-radius:50%;
 display:inline-block;

}

.row{

 gap:8px;

.row>*{
 flex:1
}

 justify-content:space-between;

.mine{

}

.tile{

}

.tile.red{
 color:#c53c4b
}

.tile.blue{
 color:#2585bd
}

.role{

 text-align:center;
 padding:18px;
 background:#11182a;
 border-radius:12px
}

.vote{
 margin:4px;
 width:auto
}

.clue{
 padding:8px;
 background:#263252;
 border-radius:7px;
 margin:5px 0
}

.small{
 font-size:12px;
 color:#aeb9d7
}

.admin-box{
 border:1px solid #d89b3a;
 background:#292315;
 border-radius:10px;
 padding:10px;
 margin-top:12px
}

.admin-label{
 color:#ffd27a;
 font-weight:900;
 font-size:12px
}

.map-box{

 background:#111827;
 border-radius:12px;

}

.map-title{
 font-size:13px;
 color:#aeb9d7;

}

.map-select{
 font-size:16px;
 font-weight:800;
 margin:0
}

.end-box{
 text-align:center;
 padding:25px;
 background:#111827;

}

@media(max-width:800px){
 .grid{
  grid-template-columns:1fr
 }

 .app{
  padding:12px
 }

 header{
  align-items:flex-start;
  gap:10px;
  flex-direction:column
 }
}
</style>
</head>

<body>

<div class="app">

<header>
 <div>
  <h1>🎉 파티 게임 라운지</h1>
  <div class="tag">
   다빈치 코드 · 마피아 · 라이어 게임 · v2.0
  </div>
 </div>

 <div id="who" class="tag"></div>
</header>


<!-- =========================
     로그인
========================= -->

<section
 id="auth"
 class="card"
 style="max-width:420px;margin:40px auto">

 <h2>입장하기</h2>

 <input
  id="id"
  placeholder="아이디 (2~20자)">

 <input
  id="pw"
  type="password"
  placeholder="비밀번호 (4자 이상)">

 <div class="row">

  <button onclick="login()">
   로그인
  </button>

  <button
   class="mint"
   onclick="signup()">
   회원가입
  </button>

 </div>

 <p class="small">
  기존 게임과 같은 회원 계정을 사용합니다.
 </p>

</section>


<!-- =========================
     로비
========================= -->

<section id="lobby" class="hidden">

 <div class="grid">

  <!-- 회원 목록 -->

  <aside class="card">

   <div class="top">

    <h3>👥 회원 목록</h3>

    <span
     id="memberCount"
     class="small">
    </span>

   </div>

   <div
    id="members"
    class="list">
   </div>

  </aside>


  <!-- 방 목록 -->

  <main class="card">

   <div class="top">

    <div>

     <h2 style="margin:0">
      🎮 게임 방
     </h2>

     <span class="small">
      방을 만들고 방 안에서 맵을 선택하세요.
     </span>

    </div>

    <button onclick="createRoom()">
     + 방 만들기
    </button>

   </div>

   <div
    id="rooms"
    class="room-grid"
    style="margin-top:16px">
   </div>

  </main>


  <!-- 실시간 접속자 -->

  <aside class="card">

   <div class="top">

    <h3>🟢 실시간 접속자</h3>

    <span
     id="onlineCount"
     class="small">
    </span>

   </div>

   <div
    id="online"
    class="list">
   </div>

   <button
    class="danger"
    style="margin-top:12px"
    onclick="logout()">

    로그아웃

   </button>

  </aside>

 </div>

</section>


<!-- =========================
     방
========================= -->

<section id="roomView" class="hidden">

 <div class="card">

  <div class="top">

   <div>

    <button onclick="leaveRoom()">
     ← 로비
    </button>

    <span id="roomTitle"></span>

   </div>

   <div id="hostControls"></div>

  </div>


  <div
   class="grid"
   style="grid-template-columns:220px 1fr 260px">

   <!-- 참가자 -->

   <aside class="card">

    <h3>참가자</h3>

    <div
     id="players"
     class="players">
    </div>

    <p
     id="roomInfo"
     class="small">
    </p>

   </aside>


   <!-- 게임 영역 -->

   <main class="card">

    <div id="gameArea"></div>

   </main>


   <!-- 채팅 -->

   <aside class="card">

    <h3>💬 방 채팅</h3>

    <div
     id="chat"
     class="chat">
    </div>

    <input
     id="chatInput"
     placeholder="메시지 입력"
     onkeydown="if(event.key==='Enter')sendChat()">

    <button onclick="sendChat()">
     전송
    </button>

   </aside>

  </div>

 </div>

</section>


</div>


<script>

/* =========================================================
   기본 설정
========================================================= */

const BASE =
 'https://andy-5cb5e-default-rtdb.firebaseio.com/othello_platform';

const ROOM='partyRooms';

const ADMIN_ID='andy212';

let me=null;

let roomId=null;

let tick=null;

let data={
 users:{},
 partyRooms:{},
 partyPresence:{}
};


const $=id=>
 document.getElementById(id);


const esc=s=>
 String(s??'').replace(
  /[&<>"']/g,
  c=>({
   '&':'&amp;',
   '<':'&lt;',
   '>':'&gt;',
   '"':'&quot;',
   "'":'&#39;'
  }[c])
 );


/* =========================================================
   관리자
========================================================= */

function isAdmin(){

 return !!(
  me &&
  me.id===ADMIN_ID
 );

}


/* =========================================================
   Firebase
========================================================= */

async function get(){

 try{

  const r=
   await fetch(BASE+'.json');

  const v=
   await r.json();

  data={
   users:v?.users||{},
   partyRooms:v?.[ROOM]||{},
   partyPresence:v?.partyPresence||{}
  };

 }catch(e){

  console.error(e);

 }

}


async function put(path,value){

 try{

  const r=
   await fetch(
    BASE+'/'+path+'.json',
    {
     method:'PUT',
     headers:{
      'Content-Type':
       'application/json'
     },
     body:JSON.stringify(value)
    }
   );

  return r.ok;

 }catch(e){

  console.error(e);

  return false;

 }

}


/* =========================================================
   화면
========================================================= */

function show(id){

 ['auth','lobby','roomView']
 .forEach(x=>{

  $(x).classList.toggle(
   'hidden',
   x!==id
  );

 });

}


/* =========================================================
   이름
========================================================= */

function name(id){

 return id===ADMIN_ID
  ?'관리자'
  :id;

}


/* =========================================================
   회원가입
========================================================= */

async function signup(){

 const id=
  $('id').value.trim();

 const pw=
  $('pw').value;

 if(
  !/^[a-zA-Z0-9가-힣_]{2,20}$/.test(id)||
  pw.length<4
 ){

  return alert(
   '아이디는 2~20자, 비밀번호는 4자 이상으로 입력하세요.'
  );

 }

 await get();

 if(data.users[id]){

  return alert(
   '이미 있는 아이디입니다.'
  );

 }

 await put(
  'users/'+encodeURIComponent(id),
  {
   id:id,
   pw:pw,
   email:'',
   joinedAt:Date.now(),
   lastActive:Date.now(),
   forceLogout:0
  }
 );

 me={
  id:id,
  pw:pw
 };

 await enter();

}


/* =========================================================
   로그인
========================================================= */

async function login(){

 const id=
  $('id').value.trim();

 const pw=
  $('pw').value;

 await get();

 const u=
  data.users[id];

 if(
  !u||
  u.pw!==pw
 ){

  return alert(
   '아이디 또는 비밀번호가 맞지 않습니다.'
  );

 }


 /*
  강제 로그아웃 플래그가
  너무 최근인 경우 차단
 */

 if(
  u.forceLogout &&
  Date.now()-u.forceLogout<15000
 ){

  return alert(
   '관리자에 의해 로그아웃 처리되었습니다.'
  );

 }

 me={
  id:id,
  pw:pw
 };

 await enter();

}


/* =========================================================
   입장
========================================================= */

async function enter(){

 localStorage.partyUser=
  JSON.stringify(me);

 await heartbeat();

 show('lobby');

 render();

 if(tick)
  clearInterval(tick);

 tick=
  setInterval(
   async()=>{

    if(!me)
     return;

    await get();

    const u=
     data.users[me.id];

    /*
     관리자에 의해 강제 로그아웃된 경우
    */

    if(
     !u||
     (
      u.forceLogout &&
      Date.now()-u.forceLogout<15000
     )
    ){

     await forceLocalLogout(
      '관리자에 의해 로그아웃되었습니다.'
     );

     return;

    }

    await heartbeat();

    render();

   },
   2500
  );

}


/* =========================================================
   로컬 강제 로그아웃
========================================================= */

async function forceLocalLogout(msg){

 if(me){

  try{

   await put(
    'partyPresence/'+
    encodeURIComponent(me.id),
    null
   );

  }catch(e){}

 }

 localStorage.removeItem(
  'partyUser'
 );

 me=null;

 roomId=null;

 if(tick)
  clearInterval(tick);

 tick=null;

 show('auth');

 if(msg)
  alert(msg);

}


/* =========================================================
   Heartbeat
========================================================= */

async function heartbeat(){

 if(!me)
  return;

 await put(
  'partyPresence/'+
  encodeURIComponent(me.id),
  {
   id:me.id,
   lastActive:Date.now()
  }
 );

 if(data.users[me.id]){

  await put(
   'users/'+
   encodeURIComponent(me.id)+
   '/lastActive',
   Date.now()
  );

 }

}


/* =========================================================
   로그아웃
========================================================= */

async function logout(){

 if(!me)
  return;

 await put(
  'partyPresence/'+
  encodeURIComponent(me.id),
  null
 );

 localStorage.removeItem(
  'partyUser'
 );

 me=null;

 roomId=null;

 if(tick)
  clearInterval(tick);

 tick=null;

 show('auth');

}


/* =========================================================
   접속자
========================================================= */

function active(){

 const now=
  Date.now();

 return Object.values(
  data.partyPresence||{}
 ).filter(
  x=>
   x&&
   now-x.lastActive<15000
 );

}


/* =========================================================
   전체 렌더
========================================================= */

function render(){

 if(!me)
  return;

 $('who').textContent=
  '👤 '+name(me.id)+
  (isAdmin()?' 👑 관리자':'');

 if(
  roomId &&
  data.partyRooms[roomId]
 ){

  renderRoom(
   data.partyRooms[roomId]
  );

 }else{

  roomId=null;

  show('lobby');

  renderLobby();

 }

}


/* =========================================================
   로비 렌더
========================================================= */

function renderLobby(){

 const users=
  Object.values(
   data.users||{}
  ).sort(
   (a,b)=>
    (b.lastActive||0)-
    (a.lastActive||0)
  );

 const online=
  active();


 $('memberCount').textContent=
  users.length+'명';


 /*
  회원 목록
 */

 $('members').innerHTML=
  users.map(u=>{

   const isOnline=
    online.some(
     x=>x.id===u.id
    );

   let adminButton='';

   if(
    isAdmin() &&
    u.id!==ADMIN_ID
   ){

    adminButton=`

     <button
      class="danger"
      style="
       padding:5px 7px;
       font-size:11px
      "
      onclick="deleteMember('${esc(u.id)}')">

      탈퇴

     </button>

    `;

   }

   return `

    <div class="item">

     <div class="top">

      <span>

       ${
        isOnline
         ?'<span class="dot"></span>'
         :'⚪ '
       }

       ${
        u.id===ADMIN_ID
         ?'👑 '
         :''
       }

       ${esc(name(u.id))}

      </span>

      ${adminButton}

     </div>

    </div>

   `;

  }).join('')
  ||
  '<p class="small">회원이 없습니다.</p>';


 /*
  접속자
 */

 $('onlineCount').textContent=
  online.length+'명';


 $('online').innerHTML=
  online.map(u=>{

   let adminButton='';

   if(
    isAdmin() &&
    u.id!==ADMIN_ID
   ){

    adminButton=`

     <button
      class="danger"
      style="
       padding:5px 7px;
       font-size:11px
      "
      onclick="forceLogoutUser('${esc(u.id)}')">

      강제 로그아웃

     </button>

    `;

   }

   return `

    <div class="item online">

     <div class="top">

      <span>
       <span class="dot"></span>
       ${esc(name(u.id))}
      </span>

      ${adminButton}

     </div>

    </div>

   `;

  }).join('')
  ||
  '<p class="small">접속자가 없습니다.</p>';


 /*
  방 목록
 */

 const rooms=
  Object.entries(
   data.partyRooms||{}
  ).filter(
   ([,r])=>
    r &&
    r.status!=='ended'
  );


 $('rooms').innerHTML=
  rooms.map(([id,r])=>{

   const count=
    Object.keys(
     r.players||{}
    ).length;

   return `

    <div class="game">

     <b>
      🎮 ${esc(r.title)}
     </b>

     <p class="small">

      현재 맵:
      ${icon(r.type)}
      ${label(r.type)}

      <br>

      ${count}/${limit(r.type)}명

      ·

      ${
       r.status==='waiting'
        ?'대기 중'
        :'게임 진행 중'
      }

     </p>

     <button
      onclick="joinRoom('${id}')"
      ${
       r.status!=='waiting'&&!isAdmin()
        ?'disabled'
        :''
      }>

      ${
       isAdmin()
        ?'관리자로 입장'
        :'참가하기'
      }

     </button>

    </div>

   `;

  }).join('')
  ||
  '<div class="notice">아직 열린 방이 없어요. 첫 번째 방장이 되어 보세요!</div>';

}


/* =========================================================
   관리자 - 회원 탈퇴
========================================================= */

async function deleteMember(id){

 if(!isAdmin())
  return;

 if(id===ADMIN_ID)
  return alert(
   '관리자 계정은 탈퇴시킬 수 없습니다.'
  );

 if(!data.users[id])
  return alert(
   '존재하지 않는 회원입니다.'
  );

 if(
  !confirm(
   name(id)+
   ' 회원을 정말 탈퇴시키겠습니까?'
  )
 )
  return;


 /*
  모든 방에서 회원 제거
 */

 for(
  const [rid,r]
  of Object.entries(
   data.partyRooms||{}
  )
 ){

  if(
   !r||
   !r.players||
   !r.players[id]
  )
   continue;

  delete r.players[id];

  const remain=
   Object.keys(r.players);

  if(r.host===id){

   if(remain.length)
    r.host=remain[0];
   else
    r.host=null;

  }

  if(remain.length===0){

   await put(
    ROOM+'/'+rid,
    null
   );

  }else{

   await put(
    ROOM+'/'+rid,
    r
   );

  }

 }


 /*
  접속 상태 삭제
 */

 await put(
  'partyPresence/'+
  encodeURIComponent(id),
  null
 );


 /*
  회원 삭제
 */

 await put(
  'users/'+
  encodeURIComponent(id),
  null
 );

 await get();

 renderLobby();

 alert(
  name(id)+' 회원을 탈퇴 처리했습니다.'
 );

}


/* =========================================================
   관리자 - 강제 로그아웃
========================================================= */

async function forceLogoutUser(id){

 if(!isAdmin())
  return;

 if(id===ADMIN_ID)
  return;

 if(
  !confirm(
   name(id)+
   ' 님을 강제 로그아웃시키겠습니까?'
  )
 )
  return;


 /*
  forceLogout 플래그를 기록
 */

 await put(
  'users/'+
  encodeURIComponent(id)+
  '/forceLogout',
  Date.now()
 );


 /*
  현재 접속 상태 제거
 */

 await put(
  'partyPresence/'+
  encodeURIComponent(id),
  null
 );

 await get();

 renderLobby();

}


/* =========================================================
   게임 이름
========================================================= */

function icon(type){

 if(type==='davinci')
  return '🧩';

 if(type==='mafia')
  return '🌙';

 return '🕵️';

}


function label(type){

 if(type==='davinci')
  return '다빈치 코드';

 if(type==='mafia')
  return '마피아';

 return '라이어 게임';

}


function limit(type){

 if(type==='davinci')
  return 4;

 if(type==='mafia')
  return 10;

 return 8;

}


function minPlayers(type){

 if(type==='davinci')
  return 2;

 if(type==='mafia')
  return 4;

 return 3;

}


/* =========================================================
   방 만들기
========================================================= */

async function createRoom(){

 /*
  이제 방 만들 때는 게임을 고르지 않는다.
  방 제목만 입력한다.
 */

 const title=
  prompt(
   '방 제목을 입력하세요.',
   '즐거운 게임 방'
  );

 if(title===null)
  return;

 const finalTitle=
  title.trim()||
  '파티 게임 방';


 /*
  기본 맵은 다빈치 코드.
  실제 맵 선택은 방 안에서 변경한다.
 */

 const id=
  'p'+Date.now();

 const room={
  id:id,

  title:finalTitle,

  type:'davinci',

  host:me.id,

  status:'waiting',

  createdAt:Date.now(),

  players:{
   [me.id]:{
    id:me.id
   }
  },

   }
  ]
 };


 const ok=

   room
  );

 if(!ok){

  );

 }

 roomId=id;

 await get();

 render();

}


/* =========================================================
   방 참가
========================================================= */

async function joinRoom(id){

 let r=
  data.partyRooms[id];

 if(!r)
  return alert(
   '방을 찾을 수 없습니다.'
  );


 /*
  관리자
 */

 if(isAdmin()){

  r.players=
   r.players||{};

  r.players[me.id]={
   id:me.id
  };

  /*
   관리자는 무조건 방장
  */

  r.host=me.id;

  r.chat=
   r.chat||[];

  r.chat.push({
   id:'system',
   text:'관리자가 입장했습니다.'
  });

  await put(
   ROOM+'/'+id,
   r
  );

  roomId=id;

  await get();

  render();

  return;

 }


 /*
  일반 회원
 */

 if(r.status!=='waiting'){

  return alert(
   '이미 게임이 시작된 방입니다.'
  );

 }

 const count=
  Object.keys(
   r.players||{}
  ).length;

 if(count>=limit(r.type)){

  return alert(
   '방이 가득 찼습니다.'
  );

 }

 r.players=
  r.players||{};

 r.players[me.id]={
  id:me.id
 };

 await put(
  ROOM+'/'+id,
  r
 );

 roomId=id;

 await get();

 render();

}


/* =========================================================
   방 나가기
========================================================= */

async function leaveRoom(){

 if(!roomId)
  return;

 const r=
  data.partyRooms[roomId];

 if(!r){

  roomId=null;

  render();

  return;

 }


 /*
  게임 종료 상태라면
  단순히 방에서 나간다.
 */

 if(r.players){

  delete r.players[me.id];

 }

 const remain=
  Object.keys(
   r.players||{}
  );


 /*
  아무도 없으면 방 삭제
 */

 if(remain.length===0){

  await put(
   ROOM+'/'+roomId,
   null
  );

 }else{

  /*
   방장이 나갔으면
   다음 참가자를 방장으로 승계
  */

  if(r.host===me.id){

   r.host=remain[0];

   r.chat=
    r.chat||[];

   r.chat.push({
    id:'system',
    text:
     name(r.host)+
     '님이 새로운 방장이 되었습니다.'
   });

  }

  await put(
   ROOM+'/'+roomId,
   r
  );

 }

 roomId=null;

 await get();

 render();

}


/* =========================================================
   방 안에서 맵 변경
========================================================= */

async function changeMap(type){

 if(!roomId)
  return;

 const r=
  data.partyRooms[roomId];

 if(!r)
  return;


 /*
  방장 또는 관리자만 변경 가능
 */

 if(
  r.host!==me.id &&
  !isAdmin()
 ){

  return alert(
   '방장만 맵을 변경할 수 있습니다.'
  );

 }


 /*
  게임 시작 후 변경 금지
 */

 if(r.status!=='waiting'){

  return alert(
   '게임이 시작된 후에는 맵을 변경할 수 없습니다.'
  );

 }


 if(
  !['davinci','mafia','liar']
  .includes(type)
 ){

  return;

 }


 /*
  같은 맵이면 아무 작업 안 함
 */

 if(r.type===type)
  return;


 r.type=type;

 /*
  기존 게임 데이터가 있다면 삭제
 */

 delete r.game;


 r.chat=
  r.chat||[];

 r.chat.push({
  id:'system',
  text:
   '게임 맵이 '+
   label(type)+
   '으로 변경되었습니다.'
 });


 const ok=
  await put(
   ROOM+'/'+roomId,
   r
  );

 if(!ok){

  alert(
   '맵 변경에 실패했습니다.'
  );

 }

}


/* =========================================================
   게임 시작
========================================================= */

async function startGame(){

 const r=
  data.partyRooms[roomId];

 if(!r)
  return;


 /*
  방장 또는 관리자만 시작
 */

 if(
  r.host!==me.id &&
  !isAdmin()
 ){

  return alert(
   '방장만 게임을 시작할 수 있습니다.'
  );

 }


 if(r.status!=='waiting'){

  return alert(
   '이미 게임이 시작되었습니다.'
  );

 }


 const ids=
  Object.keys(
   r.players||{}
  );


 const min=
  minPlayers(r.type);


 if(ids.length<min){

  return alert(
   label(r.type)+
   '은 최소 '+
   min+
   '명이 필요합니다.'
  );

 }


 /*
  선택된 맵에 따라 게임 생성
 */

 if(r.type==='davinci'){

  r.game=
   createDavinci(ids);

 }

 else if(r.type==='mafia'){

  r.game=
   createMafia(ids);

 }

 else if(r.type==='liar'){

  r.game=
   createLiar(ids);

 }


 /*
  반드시 playing으로 변경
 */

 r.status='playing';

 r.startedAt=
  Date.now();

 r.chat=
  r.chat||[];

 r.chat.push({
  id:'system',
  text:
   '🎮 '+
   label(r.type)+
   ' 게임이 시작되었습니다!'
 });


 const ok=
  await put(
   ROOM+'/'+roomId,
   r
  );

 if(!ok){

  return alert(
   '게임 시작에 실패했습니다.'
  );

 }


 /*
  최신 데이터 다시 불러오기
 */

 await get();

 render();

}

/* =========================================================
   공통 셔플
========================================================= */

function shuffle(arr){

 return [...arr]
  .sort(
   ()=>Math.random()-.5
  );

}


/* =========================================================
   다빈치 코드 생성
========================================================= */

function createDavinci(ids){

 /*
  숫자 0~11
  빨강/파랑
 */

 let deck=[];

 for(let n=0;n<12;n++){

  deck.push('🔴 '+n);
  deck.push('🔵 '+n);

 }

 deck=
  shuffle(deck);


 let hands={};

 ids.forEach(id=>{

  hands[id]=
   deck
   .splice(0,4)
   .sort(
    tileSort
   );

 });


 return{

  ids:ids,

  hands:hands,

  deck:deck,

  turn:0,

  revealed:{},

  finished:false,

  log:[
   '게임이 시작되었습니다.'
  ]

 };

}


function tileNumber(tile){

 const m=
  String(tile)
  .match(/\d+/);

 return m
  ?Number(m[0])
  :0;

}


function tileSort(a,b){

 return tileNumber(a)-
  tileNumber(b);

}


/* =========================================================
   다빈치 코드 화면
========================================================= */

function drawDavinci(r){

 const g=
  r.game;

 const turn=
  g.ids[
   g.turn%g.ids.length
  ];

 const my=
  g.hands[me.id]||[];

 const opponents=
  g.ids.filter(
   id=>id!==me.id
  );


 return `

  <h2>🧩 다빈치 코드</h2>

  <div class="notice">

   ${
    turn===me.id
     ?'🟢 당신의 차례입니다!'
     :'⏳ '+esc(name(turn))+
      '님의 차례입니다.'
   }

  </div>


  <h3>내 타일</h3>

  <div class="tiles">

   ${
    my.map(x=>`

     <span
      class="
       tile
       ${
        x.startsWith('🔴')
         ?'red'
         :'blue'
       }
      ">

      ${esc(x)}

     </span>

    `).join('')
   }

  </div>


  <h3>상대 타일</h3>

  ${
   opponents.map(id=>`

    <div class="notice">

     <b>
      ${esc(name(id))}
     </b>

     <br><br>

     ${
      g.hands[id]
       .map((x,i)=>`

        <button
         class="
          tile
          ${
           x.startsWith('🔴')
            ?'red'
            :'blue'
          }
         "
         ${
          turn!==me.id
           ?'disabled'
           :''
         }
         onclick="guessDavinci('${id}',${i})">

         ${
          g.revealed[id+'-'+i]
           ?esc(x)
           :'?'
         }

        </button>

       `).join('')
     }

    </div>

   `).join('')
  }


  <div class="row">

   <button
    ${
     turn!==me.id||
     !g.deck.length
      ?'disabled'
      :''
    }
    onclick="drawDavinciTile()">

    타일 뽑기
    (${g.deck.length})

   </button>


   <button
    class="mint"
    ${
     turn!==me.id
      ?'disabled'
      :''
    }
    onclick="passDavinciTurn()">

    추리 안 함

   </button>

  </div>


  <p class="small">
   상대의 ? 타일을 눌러 숫자를 추리하세요.
  </p>

 `;

}


/* =========================================================
   다빈치 - 타일 뽑기
========================================================= */

async function drawDavinciTile(){

 const r=
  data.partyRooms[roomId];

 const g=
  r.game;

 const turn=
  g.ids[
   g.turn%g.ids.length
  ];

 if(turn!==me.id)
  return;

 if(!g.deck.length)
  return;


 const tile=
  g.deck.pop();

 g.hands[me.id].push(tile);

 g.hands[me.id].sort(
  tileSort
 );

 await put(
  ROOM+'/'+roomId,
  r
 );

}


/* =========================================================
   다빈치 - 턴 넘기기
========================================================= */

async function passDavinciTurn(){

 const r=
  data.partyRooms[roomId];

 const g=
  r.game;

 const turn=
  g.ids[
   g.turn%g.ids.length
  ];

 if(turn!==me.id)
  return;

 g.turn=
  (g.turn+1)%
  g.ids.length;

 await put(
  ROOM+'/'+roomId,
  r
 );

}


/* =========================================================
   다빈치 - 추리
========================================================= */

async function guessDavinci(id,index){

 const r=
  data.partyRooms[roomId];

 const g=
  r.game;

 const turn=
  g.ids[
   g.turn%g.ids.length
  ];

 if(turn!==me.id)
  return;


 const answer=
  prompt(
   name(id)+
   '님의 '+
   (index+1)+
   '번째 타일 숫자를 입력하세요.\n(0~11)'
  );

 if(answer===null)
  return;


 const actual=
  tileNumber(
   g.hands[id][index]
  );


 if(
  Number(answer.trim())===
  actual
 ){

  g.revealed[
   id+'-'+index
  ]=
   g.hands[id][index];

  g.log.push(
   name(me.id)+
   '님이 정답을 맞혔습니다.'
  );


  /*
   상대의 모든 타일 공개
  */

  const allOpen=
   g.hands[id].every(
    (_,i)=>
     g.revealed[id+'-'+i]
   );


  if(allOpen){

   r.status='ended';

   g.finished=true;

   g.winner=
    me.id;

   g.loser=
    id;

   g.log.push(
    name(id)+
    '님의 모든 타일이 공개되었습니다.'
   );

  }else{

   /*
    맞히면 계속 자기 차례
   */

  }

 }else{

  g.log.push(
   name(me.id)+
   '님의 추리가 틀렸습니다.'
  );

  /*
   틀리면 다음 사람
  */

  g.turn=
   (g.turn+1)%
   g.ids.length;

 }


 await put(
  ROOM+'/'+roomId,
  r
 );


}


/* =========================================================
   마피아 생성
========================================================= */

function createMafia(ids){

 let roles=[];


 roles.push('마피아');
 roles.push('마피아');
 roles.push('경찰');
 roles.push('의사');


 while(
  roles.length<ids.length
 ){

  roles.push('시민');

 }


 roles=
  shuffle(roles);


 let roleMap={};

 ids.forEach(
  (id,i)=>{
   roleMap[id]=roles[i];
  }
 );


 return{

  ids:ids,

  roles:roleMap,

  phase:'night',

  round:1,

  votes:{},

  nightActions:{},

  alive:[...ids],

  log:[
   '밤이 되었습니다.'
  ],

  winner:null

 };

}

   마피아 화면

  </div>

   ${

     ?
     `
      밤 행동을 선택하세요.
      <br>
      ${
       role==='마피아'
        ?'마피아: 제거할 사람을 선택'
        :role==='경찰'
        ?'경찰: 조사할 사람을 선택'
        :role==='의사'
        ?'의사: 보호할 사람을 선택'
        :'시민은 밤 행동이 없습니다.'
      }
     `
     :
     `
      낮입니다.
      토론 후 마피아로 의심되는 사람을 투표하세요.
     `
   }

  </div>


  ${
   r.host===me.id||isAdmin()
    ?
    `
     <button
      class="gold"
      onclick="nextMafiaPhase()">

      ${
       g.phase==='night'
        ?'☀️ 아침으로'
        :'🌙 밤으로'
      }

     </button>
    `
    :''
  }


  <p class="small">
   생존 여부:
   ${
    alive
     ?'생존'
     :'사망'
   }
  </p>

 `;

}


/* =========================================================
   마피아 행동
========================================================= */

async function mafiaAction(id){

 const r=
  data.partyRooms[roomId];

 const g=
  r.game;

 if(
  !g.alive.includes(me.id)
 )
  return;

 const role=
  g.roles[me.id];


 /*
  밤
 */

 if(g.phase==='night'){

  if(
   role!=='마피아' &&
   role!=='경찰' &&
   role!=='의사'
  )
   return;

  g.nightActions=
   g.nightActions||{};

  if(g.nightActions[me.id])
   return;

  g.nightActions[me.id]={
   target:id,
   role:role
  };

  /*
   경찰은 조사 결과를
   자기에게만 저장
  */

  if(role==='경찰'){

   g.investigations=
    g.investigations||{};

   g.investigations[me.id]=
    g.roles[id];

   alert(
    name(id)+
    '님의 역할은 ['+
    g.roles[id]+
    ']입니다.'
   );

  }

 }


 /*
  낮
 */

 else{

  g.votes=
   g.votes||{};

  g.votes[me.id]=id;

 }


 await put(
  ROOM+'/'+roomId,
  r
 );

}


/* =========================================================
   마피아 다음 단계
========================================================= */

async function nextMafiaPhase(){

 const r=
  data.partyRooms[roomId];

 const g=
  r.game;

 if(
  r.host!==me.id &&
  !isAdmin()
 )
  return;


 /*
  밤 → 낮
 */

 if(g.phase==='night'){

  const actions=
   g.nightActions||{};

  let killTarget=null;
  let saveTarget=null;


  Object.values(actions)
   .forEach(a=>{

    if(a.role==='마피아')
     killTarget=a.target;

    if(a.role==='의사')
     saveTarget=a.target;

   });


  if(
   killTarget &&
   killTarget!==saveTarget
  ){

   g.alive=
    g.alive.filter(
     x=>x!==killTarget
    );

   g.log.push(
    name(killTarget)+
    '님이 밤에 사망했습니다.'
   );

  }else if(
   killTarget &&
   killTarget===saveTarget
  ){

   g.log.push(
    '의사가 누군가를 살렸습니다! 🩺'
   );

  }


  g.phase='day';

  g.votes={};

  g.nightActions={};

 }


 /*
  낮 → 밤
 */

 else{

  const votes=
   g.votes||{};

  const counts={};


  Object.values(votes)
   .forEach(id=>{

    counts[id]=
     (counts[id]||0)+1;

   });


  const candidates=
   Object.keys(counts);


  if(candidates.length){

   candidates.sort(
    (a,b)=>
     counts[b]-counts[a]
   );

   const out=
    candidates[0];

   g.alive=
    g.alive.filter(
     x=>x!==out
    );

   g.log.push(
    name(out)+
    '님이 투표로 퇴장했습니다.'
   );

  }


  g.phase='night';

  g.votes={};

  g.nightActions={};

  g.round++;

 }


 /*
  승리 조건
 */

 const mafiaCount=
  g.alive.filter(
   id=>g.roles[id]==='마피아'
  ).length;

 const citizenCount=
  g.alive.filter(
   id=>g.roles[id]!=='마피아'
  ).length;


 if(mafiaCount===0){

  g.winner='citizens';

  r.status='ended';

 }


 else if(
  mafiaCount>=citizenCount
 ){

  g.winner='mafia';

  r.status='ended';

 }


 await put(
  ROOM+'/'+roomId,
  r
 );


}


/* =========================================================
   라이어 생성
========================================================= */

function createLiar(ids){

 const topics=
  shuffle([
   '비빔밥',
   '제주도',
   '아이돌 콘서트',
   '피자',
   '학교 급식',
   '벚꽃놀이',
   '축구',
   '영화관',
   '놀이공원',
   '치킨',
   '여름휴가',
   '카페'
  ]);


 const liar=
  ids[
   Math.floor(
    Math.random()*ids.length
   )
  ];


 return{

  ids:ids,

  liar:liar,

  word:topics[0],

  round:1,

  clues:[],

  votes:{},

  phase:'clue',

  winner:null

 };

}


/* =========================================================
   라이어 화면
========================================================= */

function drawLiar(r){

 const g=
  r.game;

 const isLiar=
  g.liar===me.id;


 return `

  <h2>🕵️ 라이어 게임</h2>


  <div class="role">

     ?'🤫 당신은 라이어입니다!'

   }

   <br>

   <span class="small">

    ${
     isLiar
      ?'제시어를 모른 채 다른 사람의 힌트를 보고 살아남으세요.'
      :'제시어를 직접 말하지 않고 힌트를 남기세요.'
    }

   </span>

  </div>


  <div class="notice">

   ${
    g.phase==='clue'
     ?'힌트를 남기는 시간입니다.'
     :'라이어를 찾아 투표하세요.'
   }

  </div>


  <h3>힌트</h3>

  ${
   g.clues.length
    ?
    g.clues.map(c=>`

     <div class="clue">

      ${esc(c.text)}

     </div>

    `).join('')

    '<p class="small">아직 힌트가 없습니다.</p>'
  }


  ${
   g.phase==='clue'
    ?
    `

     <textarea
      id="clueInput"
      placeholder="제시어를 직접 말하지 않는 힌트를 입력하세요.">
     </textarea>

     <button
      onclick="addLiarClue()">

      힌트 남기기

     </button>


     ${
      r.host===me.id||isAdmin()
       ?
       `
        <button
         class="gold"
         onclick="startLiarVote()">

         투표 시작

       `
       :''
     }

    `

     <h3>투표</h3>

     ${
      g.ids.map(id=>`

       <button
        class="vote"
        onclick="voteLiar('${id}')">

        ${esc(name(id))}

       </button>

      `).join('')
     }


     ${
      r.host===me.id||isAdmin()
       ?
       `
        <br><br>

        <button
         class="gold"
         onclick="finishLiarGame()">

         결과 공개

        </button>
       `
       :''
     }

    `
  }

 `;

}


/* =========================================================
   라이어 - 힌트
========================================================= */

async function addLiarClue(){

 const input=
  $('clueInput');

 if(!input)
  return;

 const text=
  input.value.trim();

 if(!text)
  return;


 const r=
  data.partyRooms[roomId];

 const g=
  r.game;


 if(
  g.clues.some(
   c=>c.id===me.id
  )
 ){

  return alert(
   '힌트는 한 번만 남길 수 있습니다.'
  );

 }


 g.clues.push({
  id:me.id,
  text:text
 });


 await put(
  ROOM+'/'+roomId,
  r
 );

}

/* =========================================================
   라이어 - 결과
========================================================= */

async function finishLiarGame(){

 const r=
  data.partyRooms[roomId];

 const g=
  r.game;

 if(
  r.host!==me.id &&
  !isAdmin()
 )
  return;


 const counts={};

 Object.values(
  g.votes||{}
 ).forEach(id=>{

  counts[id]=
   (counts[id]||0)+1;

 });


 let picked=null;

 const candidates=
  Object.keys(counts);


 if(candidates.length){

  candidates.sort(
   (a,b)=>
    counts[b]-counts[a]
  );

  picked=
   candidates[0];

 }


 g.picked=
  picked;

 g.winner=
  picked===g.liar
   ?'players'
   :'liar';


 r.status='ended';


 r.chat=
  r.chat||[];

 r.chat.push({
  id:'system',
  text:
   '🕵️ 라이어는 '+
   name(g.liar)+
   '님이었습니다! '+
   (
    picked===g.liar
     ?'🎉 라이어를 찾아냈습니다!'
     :'😈 라이어가 살아남았습니다!'
   )
 });


 await put(
  ROOM+'/'+roomId,
  r
 );


}


/* =========================================================
   방 채팅
========================================================= */

async function sendChat(){

 const input=
  $('chatInput');

 const text=
  input.value.trim();

 if(
  !text||
  !roomId
 )
  return;


 input.value='';


 const r=
  data.partyRooms[roomId];

 if(!r)
  return;


 r.chat=
  r.chat||[];

 r.chat.push({
  id:me.id,
  text:text,
  time:Date.now()
 });


 r.chat=
  r.chat.slice(-50);


 await put(
  ROOM+'/'+roomId,
  r
 );


}
