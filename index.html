<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>파티 게임 라운지 v3.12</title>

<style>
*{
 box-sizing:border-box;
 font-family:system-ui,-apple-system,"Pretendard",sans-serif
}

body{
 margin:0;
 background:#10131f;
 color:#edf2f7;
 min-height:100vh
}

.app{
 max-width:1160px;
 margin:auto;
 padding:24px
}

header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 background:linear-gradient(110deg,#202a4a,#44235c);
 padding:20px 24px;
 border-radius:20px;
 border:1px solid #7486cf
}

h1{
 margin:0;
 font-size:26px
}

.tag{
 color:#b9c7ff;
 font-size:13px
}

.hidden{
 display:none!important
}

.card{
 background:#181d2e;
 border:1px solid #303a58;
 border-radius:15px;
 padding:18px
}

.grid{
 display:grid;
 grid-template-columns:250px 1fr 260px;
 gap:14px;
 margin-top:15px
}

.room-grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:12px
}

.game{
 border:1px solid #39476b;
 border-radius:14px;
 padding:15px;
 background:linear-gradient(145deg,#1e2740,#161b2b)
}

button{
 border:0;
 border-radius:9px;
 padding:10px 13px;
 background:#7184e8;
 color:white;
 font-weight:800;
 cursor:pointer
}

button:hover{
 filter:brightness(1.12)
}

button:disabled{
 opacity:.45;
 cursor:not-allowed
}

.danger{
 background:#de5570
}

.gold{
 background:#d89b3a
}

.mint{
 background:#25a99a
}

input,select,textarea{
 width:100%;
 border:1px solid #44547b;
 background:#101523;
 color:white;
 padding:10px;
 border-radius:8px;
 margin:5px 0
}

.list{
 max-height:480px;
 overflow:auto
}

.item{
 padding:9px;
 border-bottom:1px solid #2b344d;
 font-size:13px;
 display:flex;
 justify-content:space-between;
 align-items:center
}

.online{
 color:#62e6b2
}

.dot{
 width:8px;
 height:8px;
 background:#62e6b2;
 border-radius:50%;
 display:inline-block;
 margin-right:5px
}

.row{
 display:flex;
 gap:8px;
 align-items:center
}

.row>*{
 flex:1
}

.top{
 display:flex;
 justify-content:space-between;
 gap:8px;
 align-items:center
}

.notice{
 padding:11px;
 background:#101725;
 border-radius:9px;
 color:#bcc7e8;
 margin:10px 0
}

.players{
 display:flex;
 flex-wrap:wrap;
 gap:8px
}

.player{
 padding:7px 10px;
 background:#273252;
 border-radius:99px;
 font-size:13px
}

.chat{
 height:170px;
 overflow:auto;
 background:#101523;
 border-radius:8px;
 padding:9px
}

.chat p{
 margin:4px 0;
 font-size:13px
}

.mine{
 color:#94b9ff
}

.tiles{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin:10px 0
}

.tile{
 min-width:48px;
 padding:12px 8px;
 border-radius:9px;
 text-align:center;
 font-weight:900;
 background:#f4eee1;
 color:#26324a;
 border:2px solid #c7b58f;
 font-size:16px;
 cursor:pointer
}

.tile.red{
 color:#c53c4b
}

.tile.blue{
 color:#2585bd
}

.map-box{
 border:1px solid #4a5c8b;
 background:#111827;
 border-radius:12px;
 padding:15px;
 margin-bottom:15px
}

.map-title{
 font-size:13px;
 color:#aeb9d7;
 margin-bottom:6px
}

.map-select{
 font-size:16px;
 font-weight:800;
 margin:0
}

.end-box{
 text-align:center;
 padding:25px;
 background:#111827;
 border-radius:12px;
 border:1px solid #4a5c8b
}

.turn-banner{
 padding:16px;
 border-radius:12px;
 text-align:center;
 font-size:18px;
 font-weight:900;
 margin-bottom:15px;
 border:2px solid #5a6fa8;
 background:#1a233a;
 color:#9db4ff;
}
.turn-banner.my-turn{
 border-color:#25a99a;
 background:#142c2a;
 color:#62e6b2;
}

@media(max-width:800px){
 .grid{
  grid-template-columns:1fr
 }
 .app{
  padding:12px
 }
 header{
  align-items:flex-start;
  gap:10px;
  flex-direction:column
 }
}

/* ================= 루미큐브 전용 UI ================= */
.rummi-board{
  background:
    radial-gradient(circle at 50% 35%,rgba(36,110,210,.38),transparent 52%),
    linear-gradient(160deg,#0a3d83,#062b61 58%,#041d46);
  border:1px solid #4778b7;
  border-radius:18px;
  padding:16px;
  min-height:560px;
  box-shadow:inset 0 0 40px rgba(0,0,0,.28);
}
.rummi-topbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.rummi-title{font-size:24px;font-weight:950;text-shadow:0 2px 4px rgba(0,0,0,.35)}
.rummi-status{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rummi-badge{padding:7px 11px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.18);font-weight:850}
.rummi-clock{min-width:76px;text-align:center;font-size:22px;font-weight:950;color:#fff3c4}
.rummi-clock.urgent{color:#ff7d7d;animation:rummiPulse .7s infinite alternate}
@keyframes rummiPulse{from{transform:scale(1)}to{transform:scale(1.06)}}
.rummi-table{
  min-height:290px;
  padding:12px;
  border-radius:14px;
  background:rgba(2,20,48,.38);
  border:1px solid rgba(255,255,255,.12);
}
.rummi-group{
  display:flex;gap:3px;align-items:flex-end;min-height:65px;
  padding:6px 8px;margin:5px 0;border-radius:10px;
  background:rgba(255,255,255,.045);
  border:1px dashed rgba(255,255,255,.13);
  overflow-x:auto;
}
.rummi-group-label{font-size:10px;color:#9db8dc;margin-right:4px;white-space:nowrap}
.rummi-tile{
  position:relative;min-width:43px;width:43px;height:56px;
  padding:0;border-radius:7px;border:2px solid #c8b98f;
  background:linear-gradient(145deg,#fffdf4,#e9e0ca);
  color:#1b2538;box-shadow:0 2px 4px rgba(0,0,0,.32);
  font-size:21px;font-weight:950;line-height:1;flex:0 0 auto;
}
.rummi-tile:hover{transform:translateY(-2px);filter:brightness(1.03)}
.rummi-tile.red{color:#d72e36}
.rummi-tile.blue{color:#1467c7}
.rummi-tile.orange{color:#e4771b}
.rummi-tile.black{color:#171717}
.rummi-tile.joker{color:#8b35b7;font-size:17px}
.rummi-tile.selected{outline:3px solid #62e6b2;outline-offset:2px;transform:translateY(-5px)}
.rummi-tile.small{min-width:37px;width:37px;height:49px;font-size:18px}
.rummi-rack{
  margin-top:12px;padding:12px 12px 14px;
  border-radius:12px 12px 20px 20px;
  background:linear-gradient(180deg,#d2a06c,#a96e3f 72%,#87522f);
  border:2px solid #6c4128;box-shadow:0 5px 12px rgba(0,0,0,.35);
}
.rummi-rack-title{display:flex;justify-content:space-between;align-items:center;color:#fff1df;font-weight:900;margin-bottom:8px}
.rummi-hand{display:flex;gap:5px;overflow-x:auto;padding:7px 4px 9px;min-height:72px}
.rummi-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.rummi-actions button{flex:1;min-width:110px}
.rummi-help{font-size:12px;color:#b9cceb;line-height:1.55}
.rummi-playerbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.rummi-player{
  padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.25);
  border:1px solid rgba(255,255,255,.13);font-size:12px
}
.rummi-player.active{border-color:#62e6b2;background:rgba(37,169,154,.25);color:#8ff1cb;font-weight:900}
.rummi-player.me{box-shadow:0 0 0 1px rgba(255,255,255,.25) inset}
.rummi-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.rummi-tools button{padding:8px 10px;font-size:12px}
.rummi-draft{
  border:2px solid #d89b3a;background:rgba(80,52,15,.35);
  padding:10px;border-radius:10px;margin:8px 0
}
.rummi-empty{text-align:center;color:#a8c3e5;padding:55px 10px}
.rummi-drop-zone{transition:.12s;border:1px dashed rgba(255,255,255,.22)}
.rummi-drop-hover{outline:2px solid #62e6b2!important;background:rgba(37,169,154,.12)!important}
.rummi-invalid{border-color:#ff7373!important;background:rgba(180,30,40,.12)!important}
.rummi-new-group-drop{margin:8px 0;padding:12px;text-align:center;border:2px dashed rgba(98,230,178,.35);border-radius:10px;color:#9debd0;font-weight:800}
.rummi-work-rack{background:linear-gradient(180deg,#b98756,#8c5734 72%,#704328)}
.rummi-drop-hint{color:#8fb4dd;font-size:12px;padding:10px}
.rummi-tile[draggable="true"]{cursor:grab}
.rummi-tile[draggable="true"]:active{cursor:grabbing}


.rummi-live-note{font-size:11px;color:#8ff1cb;font-weight:800;margin-left:6px}
.rummi-hand .rummi-tile.selected{box-shadow:0 0 0 2px rgba(98,230,178,.35),0 4px 8px rgba(0,0,0,.35)}

.rummi-modal-note{font-size:13px;color:#dbe8fb}
.rummi-opponent{
  display:flex;justify-content:space-between;align-items:center;
  padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.08);font-size:12px
}
@media(max-width:800px){
 .rummi-board{padding:10px}
 .rummi-table{min-height:250px}
 .rummi-tile{min-width:38px;width:38px;height:51px;font-size:18px}
 .rummi-tile.small{min-width:34px;width:34px;height:46px;font-size:16px}
}

</style>
</head>

<body>

<div class="app">

<header>
 <div>
  <h1>🎉 파티 게임 라운지</h1>
  <div class="tag">
   다빈치 코드 · 마피아 · 라이어 게임 · 루미큐브 · v3.12
  </div>
 </div>
 <div id="who" class="tag"></div>
</header>

<!-- 로그인 -->
<section id="auth" class="card" style="max-width:420px;margin:40px auto">
 <div id="loginFormBox">
  <h2>로그인</h2>
  <input id="loginId" placeholder="아이디" onkeydown="if(event.key==='Enter')login()">
  <input id="loginPw" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')login()">
  <div class="row" style="margin-top:10px">
   <button onclick="login()">로그인</button>
   <button class="mint" onclick="switchAuth('signup')">회원가입</button>
  </div>
  <button class="danger" style="width:100%;margin-top:8px" onclick="switchAuth('find')">비밀번호 찾기</button>
 </div>

 <div id="signupFormBox" class="hidden">
  <h2>회원가입</h2>
  <input id="signupId" placeholder="아이디 (2~20자)">
  <input id="signupPw" type="password" placeholder="비밀번호 (4자 이상)">
  <input id="signupPwConfirm" type="password" placeholder="비밀번호 확인">
  <input id="signupEmail" placeholder="이메일 (예: id@korea.kr)">
  <div class="row" style="margin-top:10px">
   <button class="mint" onclick="signup()">가입하기</button>
   <button class="danger" onclick="switchAuth('login')">돌아가기</button>
  </div>
 </div>

 <div id="findFormBox" class="hidden">
  <h2>비밀번호 찾기</h2>
  <input id="findId" placeholder="가입한 아이디 입력">
  <input id="findEmail" placeholder="가입한 이메일 입력 (@korea.kr)">
  <input id="newPw" type="password" placeholder="새로운 비밀번호 입력">
  <div class="row" style="margin-top:10px">
   <button class="gold" onclick="resetPassword()">비밀번호 재설정</button>
   <button class="danger" onclick="switchAuth('login')">돌아가기</button>
  </div>
 </div>
</section>

<!-- 로비 -->
<section id="lobby" class="hidden">
 <div class="grid">
  <aside class="card">
   <div class="top">
    <h3>👥 회원 목록</h3>
    <span id="memberCount" class="small"></span>
   </div>
   <div id="members" class="list"></div>
  </aside>

  <main class="card">
   <div class="top">
    <div>
     <h2 style="margin:0">🎮 게임 방</h2>
     <span class="small">방을 만들고 맵을 선택하세요.</span>
    </div>
    <button onclick="createRoom()">+ 방 만들기</button>
   </div>
   <div id="rooms" class="room-grid" style="margin-top:16px"></div>
  </main>

  <aside class="card">
   <div class="top">
    <h3>🟢 실시간 접속자</h3>
    <span id="onlineCount" class="small"></span>
   </div>
   <div id="online" class="list"></div>
   <button class="danger" style="margin-top:12px" onclick="logout()">로그아웃</button>
  </aside>
 </div>
</section>

<!-- 방 -->
<section id="roomView" class="hidden">
 <div class="card">
  <div class="top">
   <div>
    <button onclick="leaveRoom()">← 로비</button>
    <span id="roomTitle"></span>
   </div>
   <div id="hostControls"></div>
  </div>

  <div class="grid" style="grid-template-columns:220px 1fr 260px">
   <aside class="card">
    <h3>참가자</h3>
    <div id="players" class="players"></div>
    <p id="roomInfo" class="small"></p>
   </aside>

   <main class="card">
    <div id="gameArea"></div>
   </main>

   <aside class="card">
    <h3>💬 방 채팅</h3>
    <div id="chat" class="chat"></div>
    <input id="chatInput" placeholder="메시지 입력" onkeydown="if(event.key==='Enter')sendChat()">
    <button onclick="sendChat()">전송</button>
   </aside>
  </div>
 </div>
</section>

</div>

<script>
const BASE = 'https://andy-5cb5e-default-rtdb.firebaseio.com/othello_platform';
const ROOM = 'partyRooms';
const ADMIN_ID = 'andy212';

let me = null;
let roomId = null;
let tick = null;
let data = { users: {}, partyRooms: {}, partyPresence: {} };

const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function isAdmin(){ return !!(me && me.id === ADMIN_ID); }

async function get(){
 try{
  const r = await fetch(BASE + '.json');
  const v = await r.json();
  data = {
   users: v?.users || {},
   partyRooms: v?.[ROOM] || {},
   partyPresence: v?.partyPresence || {}
  };
 }catch(e){ console.error(e); }
}

async function put(path, value){
 try{
  const r = await fetch(BASE + '/' + path + '.json', {
   method: 'PUT',
   headers: { 'Content-Type': 'application/json' },
   body: JSON.stringify(value)
  });
  return r.ok;
 }catch(e){ console.error(e); return false; }
}

function show(id){
 ['auth','lobby','roomView'].forEach(x => {
  $(x).classList.toggle('hidden', x !== id);
 });
}

function name(id){ return id === ADMIN_ID ? '관리자' : id; }

function switchAuth(mode){
 $('loginFormBox').classList.toggle('hidden', mode !== 'login');
 $('signupFormBox').classList.toggle('hidden', mode !== 'signup');
 $('findFormBox').classList.toggle('hidden', mode !== 'find');
}

async function signup(){
 const id = $('signupId').value.trim();
 const pw = $('signupPw').value;
 const pwc = $('signupPwConfirm').value;
 const email = $('signupEmail').value.trim();

 if(!/^[a-zA-Z0-9가-힣_]{2,20}$/.test(id) || pw.length < 4){
  return alert('아이디는 2~20자, 비밀번호는 4자 이상으로 입력하세요.');
 }
 if(pw !== pwc) return alert('비밀번호가 일치하지 않습니다.');
 if(!email.endsWith('@korea.kr')){
  return alert('이메일은 반드시 @korea.kr 형식이어야 합니다.');
 }

 await get();
 if(data.users[id]) return alert('이미 존재하는 아이디입니다.');

 const usersArr = Object.values(data.users || {});
 if(usersArr.some(u => u.email === email)){
  return alert('이미 가입된 이메일 주소입니다.');
 }

 await put('users/' + encodeURIComponent(id), { 
  id: id, 
  pw: pw, 
  email: email, 
  joinedAt: Date.now(), 
  lastActive: Date.now() 
 });
 alert('회원가입 완료! 로그인 해주세요.');
 switchAuth('login');
}

async function login(){
 const id = $('loginId').value.trim();
 const pw = $('loginPw').value;
 await get();
 const u = data.users[id];
 if(!u || u.pw !== pw) return alert('아이디 또는 비밀번호가 맞지 않습니다.');
 me = { id:id, pw:pw };
 await enter();
}

async function resetPassword(){
 const id = $('findId').value.trim();
 const email = $('findEmail').value.trim();
 const newPw = $('newPw').value;

 if(!id || !email || !newPw){
  return alert('아이디, 이메일, 새로운 비밀번호를 모두 입력해주세요.');
 }
 if(newPw.length < 4){
  return alert('비밀번호는 4자 이상으로 입력하세요.');
 }

 await get();
 const u = data.users[id];
 if(!u || u.email !== email){
  return alert('일치하는 회원 정보를 찾을 수 없습니다. 아이디와 이메일을 확인해주세요.');
 }

 u.pw = newPw;
 await put('users/' + encodeURIComponent(id), u);
 alert('비밀번호가 성공적으로 재설정되었습니다! 새 비밀번호로 로그인하세요.');
 switchAuth('login');
}

async function enter(){
 localStorage.partyUser = JSON.stringify(me);
 await heartbeat();
 show('lobby');
 render();
 if(tick) clearInterval(tick);
 tick = setInterval(async () => {
  if(!me) return;
  await get();
  await heartbeat();
  render();
 }, 2000);
}

async function heartbeat(){
 if(!me) return;
 await put('partyPresence/' + encodeURIComponent(me.id), { id:me.id, lastActive:Date.now() });
 if(data.users[me.id]){
  await put('users/' + encodeURIComponent(me.id) + '/lastActive', Date.now());
 }
}

async function logout(){
 if(!me) return;
 await put('partyPresence/' + encodeURIComponent(me.id), null);
 localStorage.removeItem('partyUser');
 me = null; roomId = null;
 if(tick) clearInterval(tick);
 tick = null;
 show('auth');
}

async function adminDeleteUser(targetId){
 if(!isAdmin()) return;
 if(targetId === ADMIN_ID) return alert('관리자는 탈퇴시킬 수 없습니다.');
 if(!confirm(targetId + ' 유저를 강제 탈퇴시키겠습니까?')) return;
 await put('users/' + encodeURIComponent(targetId), null);
 await put('partyPresence/' + encodeURIComponent(targetId), null);
 await get();
 render();
}

async function adminForceLogout(targetId){
 if(!isAdmin()) return;
 await put('partyPresence/' + encodeURIComponent(targetId), null);
 await get();
 render();
}

async function adminDeleteRoom(id){
 if(!isAdmin()) return;
 if(!confirm('해당 방을 강제로 폭파하시겠습니까?')) return;
 await put(ROOM + '/' + id, null);
 await get();
 render();
}

function active(){
 const now = Date.now();
 return Object.values(data.partyPresence || {}).filter(x => x && now - x.lastActive < 15000);
}

function render(){
 if(!me) return;
 $('who').textContent = '👤 ' + name(me.id) + (isAdmin() ? ' 👑 관리자' : '');
 if(roomId && data.partyRooms[roomId]){
  renderRoom(data.partyRooms[roomId]);
 } else {
  roomId = null;
  show('lobby');
  renderLobby();
 }
}

function renderLobby(){
 const users = Object.values(data.users || {}).sort((a,b) => (b.lastActive||0) - (a.lastActive||0));
 const online = active();
 $('memberCount').textContent = users.length + '명';

 $('members').innerHTML = users.map(u => {
  const isOnline = online.some(x => x.id === u.id);
  return `
   <div class="item">
    <span>${isOnline ? '<span class="dot"></span>' : '⚪ '} ${u.id===ADMIN_ID?'👑 ':''}${esc(name(u.id))}</span>
    ${isAdmin() && u.id !== ADMIN_ID ? `<button class="danger" style="padding:4px 8px;font-size:11px" onclick="adminDeleteUser('${u.id}')">탈퇴</button>` : ''}
   </div>`;
 }).join('') || '<p class="small">회원이 없습니다.</p>';

 $('onlineCount').textContent = online.length + '명';
 $('online').innerHTML = online.map(u => `
  <div class="item online">
   <span><span class="dot"></span>${esc(name(u.id))}</span>

 }).join('') || '<div class="notice">아직 열린 방이 없어요. 첫 번째 방장이 되어 보세요!</div>';
}

function icon(type){
 if(type==='davinci') return '🧩';
 if(type==='mafia') return '🌙';
 if(type==='rummikub') return '🎲';
 return '🕵️';
}

function label(type){
 if(type==='davinci') return '다빈치 코드';
 if(type==='mafia') return '마피아';
 if(type==='rummikub') return '루미큐브';
 return '라이어 게임';
}

function limit(type){
 if(type==='rummikub') return 4;
 if(type==='davinci') return 4;
 if(type==='mafia') return 10;
 return 8;
}

function minPlayers(type){
 if(type==='rummikub') return 2;
 if(type==='davinci') return 2;
 if(type==='mafia') return 4;
 return 3;
}

async function createRoom(){
 const title = prompt('방 제목을 입력하세요.', '즐거운 게임 방');
 if(title === null) return;
 const finalTitle = title.trim() || '파티 게임 방';
 const id = 'p' + Date.now();
 const room = {
  id: id,
  title: finalTitle,
  type: 'davinci',
  host: me.id,
  status: 'waiting',
  createdAt: Date.now(),
  players: { [me.id]: { id: me.id } },
  chat: [{ id: 'system', text: name(me.id) + '님이 방을 만들었습니다.' }]
 };
 const ok = await put(ROOM + '/' + id, room);
 if(!ok) return alert('방 생성에 실패했습니다.');
 roomId = id;
 await get();
 render();
}

async function joinRoom(id){
 let r = data.partyRooms[id];
 if(!r) return alert('방을 찾을 수 없습니다.');
 if(isAdmin()){
  r.players = r.players || {};
  r.players[me.id] = { id: me.id };
  await put(ROOM + '/' + id, r);
  roomId = id;
  await get();
  render();
  return;
 }
 if(r.status !== 'waiting') return alert('이미 게임이 시작된 방입니다.');
 if(Object.keys(r.players || {}).length >= limit(r.type)) return alert('방이 가득 찼습니다.');
 r.players = r.players || {};
 r.players[me.id] = { id: me.id };
 await put(ROOM + '/' + id, r);
 roomId = id;
 await get();
 render();
}

async function leaveRoom(){
 if(!roomId) return;
 const r = data.partyRooms[roomId];
 if(!r){ roomId = null; render(); return; }
 if(r.players) delete r.players[me.id];
 const remain = Object.keys(r.players || {});
 if(remain.length === 0){
  await put(ROOM + '/' + roomId, null);
 } else {
  if(r.host === me.id){
   r.host = remain[0];
   r.chat = r.chat || [];
   r.chat.push({ id: 'system', text: name(r.host) + '님이 새로운 방장이 되었습니다.' });
  }
  await put(ROOM + '/' + roomId, r);
 }
 roomId = null;
 await get();
 render();
}

async function backToWaitingRoom(){
 const r = data.partyRooms[roomId];
 if(!r) return;
 if(r.host !== me.id && !isAdmin()) return alert('방장만 대기실로 되돌릴 수 있습니다.');
 r.status = 'waiting';
 delete r.game;
 r.chat = r.chat || [];
 r.chat.push({ id: 'system', text: '🏠 방장이 게임을 종료하고 대기실(방)로 돌아왔습니다.' });
 await put(ROOM + '/' + roomId, r);

}

async function changeMap(type){

async function startGame(){
 const r = data.partyRooms[roomId];
 if(!r) return;
 if(r.host !== me.id && !isAdmin()) return alert('방장만 게임을 시작할 수 있습니다.');
 
 const ids = Object.keys(r.players || {});
 const min = minPlayers(r.type);
 if(ids.length < min) return alert(label(r.type) + '은 최소 ' + min + '명이 필요합니다.');

 if(r.type === 'davinci'){
  r.game = createDavinci(ids);
 } else if(r.type === 'mafia'){
  r.game = createMafia(ids);
 } else if(r.type === 'liar'){
  r.game = createLiar(ids);
 } else if(r.type === 'rummikub'){
  r.game = createRummikub(ids, Number(r.turnLimit) === 60 ? 60 : 30);
  /* 루미큐브 게임 상태의 필수 필드 보장 */
  r.game.opened = {};
  ids.forEach(id => { r.game.hands[id] = Array.isArray(r.game.hands[id]) ? r.game.hands[id] : []; });
 }

 r.status = 'playing';
 r.startedAt = Date.now();
 r.chat = r.chat || [];
 r.chat.push({ id: 'system', text: '🎮 ' + label(r.type) + ' 게임이 시작되었습니다!' });

 const ok = await put(ROOM + '/' + roomId, r);
 if(!ok) return alert('게임 시작에 실패했습니다.');
 await get();
 render();
}

 r.chat = r.chat || [];
 r.chat.push({ id: me.id, text: text });
 input.value = '';
 await put(ROOM + '/' + roomId, r);
 await get();
 render();
}

function shuffle(arr){
 return [...arr].sort(() => Math.random() - .5);
}

/* ================= 다빈치 코드 로직 ================= */
function createDavinci(ids){
 let deck = [];
 for(let n = 0; n < 12; n++){
  deck.push('🔴 ' + n);
  deck.push('🔵 ' + n);
 }
 deck = shuffle(deck);
 let hands = {};
 ids.forEach(id => {
  hands[id] = deck.splice(0, 4).sort(tileSort);
 });
 return {
  ids: ids,
  hands: hands,
  deck: deck,
  turn: 0,
  revealed: {},
  finished: false
 };
}

function tileNumber(tile){
 const m = String(tile).match(/\d+/);
 return m ? Number(m[0]) : 0;
}

function tileSort(a, b){
 return tileNumber(a) - tileNumber(b);
}

function drawDavinci(r){
 const g = r.game;
 if(!g || !g.ids) return `<div class="notice">게임 데이터를 불러오는 중...</div>`;
 
 g.revealed = g.revealed || {};
 const turn = g.ids[g.turn % g.ids.length];
 const my = g.hands[me.id] || [];
 const opponents = g.ids.filter(id => id !== me.id);
 const isMyTurn = (turn === me.id);

 return `
  <h2>🧩 다빈치 코드</h2>
  <div class="turn-banner ${isMyTurn ? 'my-turn' : ''}">
   ${isMyTurn ? '🟢 당신의 차례입니다!' : '⏳ ' + esc(name(turn)) + '님의 차례입니다.'}
  </div>

  <h3>상대 타일</h3>
  ${opponents.map(id => `
   <div class="notice">
    <b>${esc(name(id))}</b><br>
    <div class="tiles">
     ${(g.hands[id] || []).map((x, i) => {
      const isRev = g.revealed[id] && g.revealed[id][i];
      return `
       <button class="tile ${x.startsWith('🔴')?'red':'blue'}" ${!isMyTurn ? 'disabled' : ''} onclick="guessDavinci('${id}',${i})">
        ${isRev ? esc(x) : '?'}
       </button>
      `;
     }).join('')}
    </div>
   </div>
  `).join('')}

  <h3>내 타일</h3>
  <div class="tiles">
   ${my.map(x => `<span class="tile ${x.startsWith('🔴')?'red':'blue'}">${esc(x)}</span>`).join('')}
  </div>

  <div class="row" style="margin-top:15px">
   <button ${!isMyTurn || !g.deck.length ? 'disabled' : ''} onclick="drawDavinciTile()">
    타일 뽑기 (${g.deck.length})
   </button>
   <button class="mint" ${!isMyTurn ? 'disabled' : ''} onclick="passDavinciTurn()">
    추리 안 함
   </button>
  </div>
  <p class="small" style="margin-top:10px">상대의 ? 타일을 눌러 숫자를 추리하세요.</p>
 `;
}

async function drawDavinciTile(){
 const r = data.partyRooms[roomId];
 const g = r.game;
 const turn = g.ids[g.turn % g.ids.length];
 if(turn !== me.id || !g.deck.length) return;

 const tile = g.deck.pop();
 g.hands[me.id].push(tile);
 g.hands[me.id].sort(tileSort);
 g.turn = (g.turn + 1) % g.ids.length;

 await put(ROOM + '/' + roomId, r);
 await get();
 render();
}

async function passDavinciTurn(){
 const r = data.partyRooms[roomId];
 const g = r.game;
 const turn = g.ids[g.turn % g.ids.length];
 if(turn !== me.id) return;

 g.turn = (g.turn + 1) % g.ids.length;
 await put(ROOM + '/' + roomId, r);
 await get();
 render();
}

async function guessDavinci(id, index){
 const r = data.partyRooms[roomId];
 const g = r.game;
 const turn = g.ids[g.turn % g.ids.length];
 if(turn !== me.id) return;

 const answer = prompt(name(id) + '님의 ' + (index + 1) + '번째 타일 숫자를 입력하세요.\n(0~11)');
 if(answer === null) return;

 const actual = tileNumber(g.hands[id][index]);
 g.revealed = g.revealed || {};
 g.revealed[id] = g.revealed[id] || {};

 if(Number(answer.trim()) === actual){
  g.revealed[id][index] = true;
  
  const allOpen = g.hands[id].every((_, i) => g.revealed[id][i]);
  if(allOpen){
   r.status = 'ended';
   g.finished = true;
   g.winner = me.id;
  }
 } else {
  g.turn = (g.turn + 1) % g.ids.length;
 }

 await put(ROOM + '/' + roomId, r);
 await get();
 render();
}


/* ================= 마피아 게임 로직 ================= */
function createMafia(ids){
 const shuffled = shuffle(ids);
 const roles = {};
 const total = shuffled.length;
 
 let mafiaCount = 1;
 let doctorCount = 1;
 let policeCount = 0;

 if(total === 5){
  mafiaCount = 1; doctorCount = 1; policeCount = 0;
 } else if(total === 6){
  mafiaCount = 2; doctorCount = 1; policeCount = 0;
 } else if(total === 7){
  mafiaCount = 2; doctorCount = 1; policeCount = 1;
 } else if(total >= 8){
  mafiaCount = 2; doctorCount = 1; policeCount = 1;
 } else {
  mafiaCount = 1; doctorCount = 1; policeCount = 0;
 }

 for(let i = 0; i < total; i++){
  const id = shuffled[i];
  if(i < mafiaCount){
   roles[id] = 'mafia';
  } else if(i < mafiaCount + doctorCount){
   roles[id] = 'doctor';
  } else if(i < mafiaCount + doctorCount + policeCount){
   roles[id] = 'police';
  } else {
   roles[id] = 'citizen';
  }
 }

 const mafias = Object.entries(roles).filter(([id, role]) => role === 'mafia').map(([id]) => id);

 return {
  ids: ids,
  roles: roles,
  mafias: mafias,
  round: 1,
  phase: 'role_check',
  nightActions: {
   kill: null,
   heal: null,
   investigate: null
  },
  investigateResultText: '',
  votes: {},
  dead: [],
  winner: null,
  lastExecuted: null
 };
}

function drawMafia(r){
 const g = r.game;
 if(!g || !g.ids) return `<div class="notice">게임 데이터를 불러오는 중...</div>`;

 g.roles = g.roles || {};
 g.dead = g.dead || [];
 g.mafias = g.mafias || [];
 g.nightActions = g.nightActions || {};

 const myRole = g.roles[me.id] || 'citizen';
 const isDead = g.dead.includes(me.id);
 const isHost = (r.host === me.id || isAdmin());
 const alivePlayers = g.ids.filter(id => !g.dead.includes(id));

 let roleNameStr = '시민';
 if(myRole === 'mafia') roleNameStr = '🚨 마피아';
 if(myRole === 'police') roleNameStr = '🔍 경찰';
 if(myRole === 'doctor') roleNameStr = '💉 의사';

 const mafiasStr = g.mafias.map(id => name(id)).join(', ');

 let html = `

   내 직업: <b>${roleNameStr}</b> ${myRole === 'mafia' ? `(동료 마피아: ${mafiasStr})` : ''}
   ${isDead ? ' <span style="color:#de5570">[사망함]</span>' : ''}
  </div>
 `;

 if(g.phase === 'ended'){
  return html + `
   <div class="end-box" style="margin-top:15px">
    <h3>🎉 마피아 게임 종료</h3>
    <p>승리 진영: <b style="color:${g.winner==='citizen'?'#62e6b2':'#de5570'}">${g.winner==='citizen'?'✨ 시민 팀 승리!':'🔥 마피아 팀 승리!'}</b></p>
    <div class="row" style="margin-top:15px">
     <button onclick="leaveRoom()">← 로비로 나가기</button>
     ${isHost ? `<button class="mint" onclick="backToWaitingRoom()">🏠 대기실(방)로 돌아가기</button>` : `<div class="notice" style="margin:0">방장이 대기실로 돌려보낼 수 있습니다.</div>`}
    </div>
   </div>
  `;
 }

 if(g.phase === 'role_check'){
  html += `
   <div class="notice" style="border:2px solid #7184e8;background:#1e2740;text-align:center;padding:20px">
    <h3>🕵️ 직업이 배정되었습니다!</h3>
    <p style="font-size:16px;margin:10px 0">위의 상단 배너에서 자신의 직업을 확인하셨나요?</p>
    <p class="small">모든 플레이어가 직업을 확인한 후 아침을 맞이하세요.</p>
   </div>

async function startMorningPhase(){
 const r = data.partyRooms[roomId];
 if(!r || !r.game) return;
 const g = r.game;
 
 g.nightActions = g.nightActions || {};
 g.nightActions.killMessage = '첫 번째 밤은 평화롭게 지나갔습니다. 아무도 사망하지 않았습니다.';
 g.phase = 'morning_result';

 r.chat = r.chat || [];
 r.chat.push({ id: 'system', text: `🌅 첫 번째 아침이 밝았습니다!` });

 checkMafiaWinCondition(r, g);

 await put(ROOM + '/' + roomId, r);
 await get();
 render();
}

async function mafiaAction(actionType, targetId){
 const r = data.partyRooms[roomId];
 if(!r || !r.game) return;
 const g = r.game;

 g.nightActions = g.nightActions || {};
 if(actionType === 'kill') g.nightActions.kill = targetId;
 if(actionType === 'heal') g.nightActions.heal = targetId;
 if(actionType === 'investigate') g.nightActions.investigate = targetId;

 await put(ROOM + '/' + roomId, r);
 await get();
 render();
}

async function processNightResult(){
 const r = data.partyRooms[roomId];
 if(!r || !r.game) return;
 const g = r.game;

 g.nightActions = g.nightActions || {};
 const targetKill = g.nightActions.kill;
 const targetHeal = g.nightActions.heal;
 const targetInv = g.nightActions.investigate;

 g.roles = g.roles || {};
 if(targetInv){
  const targetRole = g.roles[targetInv];
  const isMafia = (targetRole === 'mafia');
  g.investigateResultText = `${name(targetInv)}님은 ${isMafia ? '🚨 마피아입니다!' : '✨ 마피아가 아닙니다 (시민 계열).'}`;
 } else {
  g.investigateResultText = '조사한 사람이 없습니다.';
 }

 let killMsg = '';
 g.dead = g.dead || [];

 if(targetKill){
  if(targetKill === targetHeal){
   killMsg = `의사 ${name(targetHeal)}님이 지난밤 마피아의 습격으로부터 플레이어를 살려냈습니다! (사망자 없음)`;
  } else {
   killMsg = `지난밤 ${name(targetKill)}님이 마피아의 습격을 받아 사망했습니다!`;
   if(!g.dead.includes(targetKill)){
    g.dead.push(targetKill);
   }
  }
 } else {
  killMsg = '지난밤 마피아가 아무도 지목하지 않아 평화로웠습니다.';
 }

 g.nightActions.killMessage = killMsg;
 g.phase = 'morning_result';

 r.chat = r.chat || [];
 r.chat.push({ id: 'system', text: `🌙 밤이 지나고 아침이 밝았습니다. ${killMsg}` });

 checkMafiaWinCondition(r, g);

 await put(ROOM + '/' + roomId, r);
 await get();
 render();
}

async function voteMafiaTarget(targetId){
 const r = data.partyRooms[roomId];
 if(!r || !r.game) return;
 const g = r.game;
 g.dead = g.dead || [];
 if(g.dead.includes(me.id)) return alert('사망자는 투표할 수 없습니다.');

 g.votes = g.votes || {};
 g.votes[me.id] = targetId;

 r.chat = r.chat || [];
 r.chat.push({ id: 'system', text: `🗳️ ${name(me.id)}님이 ${name(targetId)}님을 처형 투표했습니다.` });

 await put(ROOM + '/' + roomId, r);
 await get();
 render();
}

async function finalizeMafiaVote(){
 const r = data.partyRooms[roomId];
 if(!r || !r.game) return;
 const g = r.game;

 const counts = {};
 Object.values(g.votes || {}).forEach(target => {
  counts[target] = (counts[target] || 0) + 1;
 });

 let maxCnt = -1;
 let executed = null;
 Object.entries(counts).forEach(([id, cnt]) => {
  if(cnt > maxCnt){
   maxCnt = cnt;
   executed = id;
  }
 });

 g.dead = g.dead || [];
 g.roles = g.roles || {};
 if(executed){
  if(!g.dead.includes(executed)){
   g.dead.push(executed);
  }
  g.lastExecuted = executed;
  const execRole = g.roles[executed];
  r.chat = r.chat || [];
  r.chat.push({ id: 'system', text: `⚖️ 투표 결과 최다 득표자인 【${name(executed)}】님이 처형되었습니다! (정체: ${execRole === 'mafia' ? '🚨 마피아' : '✨ 시민 계열'})` });
 } else {
  r.chat = r.chat || [];
  r.chat.push({ id: 'system', text: `⚖️ 투표에 참여한 사람이 없어 아무도 처형되지 않았습니다.` });
 }

 g.nightActions = { kill: null, heal: null, investigate: null };
 g.round++;
 g.phase = 'night';

 checkMafiaWinCondition(r, g);

 await put(ROOM + '/' + roomId, r);
 await get();
 render();
}

function checkMafiaWinCondition(r, g){
 g.dead = g.dead || [];
 g.roles = g.roles || {};
 const alive = g.ids.filter(id => !g.dead.includes(id));
 const aliveMafias = alive.filter(id => g.roles[id] === 'mafia');
 const aliveCitizens = alive.filter(id => g.roles[id] !== 'mafia');

 if(aliveMafias.length === 0){
  g.phase = 'ended';
  g.winner = 'citizen';
  r.chat = r.chat || [];
  r.chat.push({ id: 'system', text: `🎉 모든 마피아가 검거되었습니다! 【시민 팀 승리!】` });
 } else if(aliveMafias.length >= aliveCitizens.length){
  g.phase = 'ended';
  g.winner = 'mafia';
  r.chat = r.chat || [];
  r.chat.push({ id: 'system', text: `🔥 마피아의 수가 시민의 수와 같거나 많아졌습니다! 【마피아 팀 승리!】` });
 }
}

function createLiar(ids){
 const word = LIAR_WORDS[Math.floor(Math.random() * LIAR_WORDS.length)];
 const shuffledIds = shuffle(ids);
 const liarId = shuffledIds[0];

 let roles = {};
 ids.forEach(id => {
  roles[id] = (id === liarId) ? 'LIAR' : word;
 });

 return {
  ids: ids,
  roles: roles,
  word: word,
  liarId: liarId,
  stage: 'playing',
  paused: false,
  pausedBy: null,
  timeLeft: 0,
  votes: {},
  winner: null,
  finalTarget: null
 };
}

function drawLiar(r){
 const g = r.game;
 if(!g || !g.ids) return `<div class="notice">게임 데이터를 불러오는 중...</div>`;

   if(!roomId) return;
   const roomData = data.partyRooms[roomId];
   if(!roomData || !roomData.game || roomData.game.stage !== 'countdown' || roomData.game.paused) return;
   
   roomData.game.timeLeft--;
   if(roomData.game.timeLeft <= 0){
    roomData.game.stage = 'voting';

async function processVoteResult(r, g){
 const counts = {};
 Object.values(g.votes || {}).forEach(target => {
  counts[target] = (counts[target] || 0) + 1;
 });

 let maxCount = -1;
 let finalTarget = g.ids[0];
 Object.entries(counts).forEach(([id, cnt]) => {
  if(cnt > maxCount){
   maxCount = cnt;
   finalTarget = id;
  }
 });

 const isTargetLiar = (finalTarget === g.liarId);
 g.stage = 'ended';
 g.winner = isTargetLiar ? 'citizen' : 'liar';
 g.finalTarget = finalTarget;

 r.chat = r.chat || [];
 r.chat.push({ 
  id: 'system', 
  text: `📊 투표 결과 발표! 최다 득표자 【${name(finalTarget)}】님 지목! 결과: ${isTargetLiar ? '🎉 라이어 검거 성공! 시민 승리!' : '❌ 시민을 지목했습니다! 라이어 승리!'}` 
 });

 await put(ROOM + '/' + roomId, r);
 await get();
 render();
}

/* ================= 루미큐브 게임 로직 ================= */
let rummiSelected = new Set();
let rummiDraft = null;
let rummiDraftTurn = null;
let rummiTimer = null;
let rummiDraggedId = null;
let rummiDraggedIds = null;

const RUMMI_COLORS = [
 {k:'red', label:'빨강', code:'R'},
 {k:'blue', label:'파랑', code:'B'},
 {k:'orange', label:'주황', code:'O'},
 {k:'black', label:'검정', code:'K'}
];

function rummiColorClass(c){ const x=RUMMI_COLORS.find(v=>v.code===c); return x?x.k:'joker'; }
function rummiColorName(c){ const x=RUMMI_COLORS.find(v=>v.code===c); return x?x.label:'조커'; }
function rummiTileText(t){ return t.j?'★':String(t.n); }
function rummiTileLabel(t){ return t.j?'조커':`${rummiColorName(t.c)} ${t.n}`; }

/* 실제 루미큐브 106장. 먼저 섞은 뒤 한 장씩 나눠야 패가 랜덤하게 들어갑니다. */
function rummiMakeDeck(){
 const tiles={}, deck=[]; let seq=0;
 RUMMI_COLORS.forEach(c=>{
  for(let copy=0;copy<2;copy++) for(let n=1;n<=13;n++){
   const id='rt'+(++seq); tiles[id]={id,n,c:c.code,j:false}; deck.push(id);
  }
 });
 for(let j=0;j<2;j++){ const id='rt'+(++seq); tiles[id]={id,n:0,c:'J',j:true}; deck.push(id); }
 /* Fisher-Yates: 게임마다 완전히 다른 순서 */
 for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
 return {tiles,deck};
}

function rummiTileScore(t){ return t?.j ? 30 : Number(t?.n||0); }
function rummiHandScore(hand,g){ return (hand||[]).reduce((sum,id)=>sum+rummiTileScore(g.tiles[id]),0); }
function rummiFinishByEmptyRack(r,playerId){
 const g=r.game; g.finished=true; g.winner=playerId;
 g.scores={};
 let total=0;
 g.ids.forEach(id=>{ if(id===playerId)return; const s=rummiHandScore(g.hands[id],g); g.scores[id]=-s; total+=s; });
 g.scores[playerId]=total;
 g.lastAction=`🎉 ${name(playerId)}님이 모든 패를 내려놓아 우승했습니다! (+${total}점)`;
 r.status='ended';
}
function rummiFinishByNoMoves(r){
 const g=r.game;
 const scores={};
 let best=null;
 g.ids.forEach(id=>{ const s=rummiHandScore(g.hands[id],g); scores[id]=s; if(best===null||s<best)best=s; });
 const winners=g.ids.filter(id=>scores[id]===best);
 g.finished=true; g.scores={};
 g.ids.forEach(id=>{ g.scores[id]=scores[id]===best ? 0 : -(scores[id]-best); });
 g.winner=winners[0]||null;
 g.lastAction=`🏁 더 이상 진행할 수 없어 게임이 종료되었습니다. 남은 패 합계가 가장 낮은 ${winners.map(id=>name(id)).join(', ')}님이 승리했습니다.`;
 r.status='ended';
}

function createRummikub(ids,turnLimit){
 const d=rummiMakeDeck();
 const hands={}; ids.forEach(id=>hands[id]=[]);
 // 공식 규칙의 선 결정: 각자 한 장을 뽑아 가장 높은 숫자가 선. 동률이면 다시 뽑는다.
 let firstIndex=0;
 while(ids.length>1){
  const picked=ids.map(()=>d.deck.pop());
  const vals=picked.map(tid=>d.tiles[tid].j?0:d.tiles[tid].n);
  const max=Math.max(...vals);
  const winners=vals.map((v,i)=>v===max?i:-1).filter(i=>i>=0);
  d.deck.push(...picked);
  if(winners.length===1){ firstIndex=winners[0]; break; }
  for(let i=d.deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d.deck[i],d.deck[j]]=[d.deck[j],d.deck[i]];}
 }
 /* 실제 게임처럼 한 장씩 돌려가며 14장씩 배분 */
 for(let round=0;round<14;round++) for(let offset=0;offset<ids.length;offset++){
  const id=ids[(firstIndex+offset)%ids.length];
  hands[id].push(d.deck.pop());
 }
 return {
  version:3, ids, tiles:d.tiles, deck:d.deck, hands, groups:[], opened:{}, turn:Math.floor(Math.random()*ids.length),
  turnLimit:turnLimit===60?60:30, turnStartedAt:Date.now(), finished:false,winner:null, scores:{}, consecutivePasses:0,
  lastAction:'게임이 시작되었습니다. 106장의 패를 완전히 섞어 각자 14장씩 나누었습니다. 첫 차례는 무작위로 정했습니다.',lastDraw:null
 };
}
function rummiCurrentTurn(g){ return g.ids[g.turn%g.ids.length]; }
function rummiTimeLeft(g){ const limit=Number(g.turnLimit||30); return Math.max(0,limit-Math.floor((Date.now()-(g.turnStartedAt||Date.now()))/1000)); }
function rummiAllTableIds(g){ return (g.groups||[]).flat(); }
function rummiResetLocal(){ rummiSelected.clear(); rummiDraft=null; rummiDraftTurn=null; rummiDraggedId=null; rummiDraggedIds=null; }

function rummiGroupOptions(group,g){
 const ts=group.map(id=>g.tiles[id]).filter(Boolean); if(ts.length<3||ts.length>13)return [];
 const jokers=ts.filter(t=>t.j), normal=ts.filter(t=>!t.j), opts=[];
 if(normal.length){
  const n=normal[0].n;
  if(normal.every(t=>t.n===n)&&new Set(normal.map(t=>t.c)).size===normal.length&&normal.length+jokers.length<=4){
   const colors=new Set(normal.map(t=>t.c));
   if(RUMMI_COLORS.filter(c=>!colors.has(c.code)).length>=jokers.length) opts.push(n*ts.length);
  }
 } else if(ts.length>=3&&ts.length<=4) for(let n=1;n<=13;n++) opts.push(n*ts.length);
 if(normal.length){
  const color=normal[0].c, nums=normal.map(t=>t.n);
  if(normal.every(t=>t.c===color)&&new Set(nums).size===nums.length){
   for(let start=1;start<=14-ts.length;start++){
    const wanted=[]; for(let n=start;n<start+ts.length;n++) wanted.push(n);
    if(nums.every(n=>wanted.includes(n))) opts.push(wanted.reduce((a,b)=>a+b,0));
   }
  }
 } else if(ts.length>=3) for(let start=1;start<=14-ts.length;start++){let sum=0;for(let n=start;n<start+ts.length;n++)sum+=n;opts.push(sum);}
 return [...new Set(opts)];
}
function rummiValidGroup(group,g){ return rummiGroupOptions(group,g).length>0; }
function rummiValidateGroups(groups,g){
 if(!groups.length)return {ok:false,reason:'테이블에 유효한 조합이 없습니다.'};
 const used=new Set();
 for(const gr of groups){ if(!rummiValidGroup(gr,g))return {ok:false,reason:'규칙에 맞지 않는 조합이 있습니다.'}; for(const id of gr){if(used.has(id))return {ok:false,reason:'같은 패를 두 곳에서 사용할 수 없습니다.'};used.add(id);} }
 return {ok:true};
}
function rummiInitialValue(groups,g){ let total=0; for(const gr of groups){const o=rummiGroupOptions(gr,g);if(!o.length)return -1;total+=Math.max(...o);}return total; }

/* 그룹에 패를 붙이면 자연스럽게 1-2-3-4-5처럼 자동 정렬 */
function rummiSortGroup(group,g){
 const ts=group.map(id=>g.tiles[id]).filter(Boolean);
 const normal=ts.filter(t=>!t.j), jokers=ts.filter(t=>t.j);
 if(!ts.length)return [];
 // 같은 색 연속 조합: 가능한 연속 구간을 찾아 조커를 정확한 빈칸에 삽입한다.
 if(normal.length>=1 && normal.every(t=>t.c===normal[0].c) && new Set(normal.map(t=>t.n)).size===normal.length){
  const color=normal[0].c, len=ts.length, nums=new Set(normal.map(t=>t.n));
  let best=null;
  for(let start=1;start<=14-len;start++){
   const wanted=[];for(let n=start;n<start+len;n++)wanted.push(n);
   if(normal.every(t=>wanted.includes(t.n))){best=wanted;break;}
  }
  if(best){
   const out=[];let ji=0;
   best.forEach(n=>{const found=normal.find(t=>t.n===n);out.push(found?found.id:jokers[ji++].id);});
   return out;
  }
 }
 // 같은 숫자 그룹: 조커는 빠진 색을 대신하므로 뒤에 붙여도 값은 동일하지만 시각적으로 색상순으로 정렬.
 if(normal.length&&normal.every(t=>t.n===normal[0].n)&&new Set(normal.map(t=>t.c)).size===normal.length){
  const order={R:0,B:1,O:2,K:3};
  normal.sort((a,b)=>(order[a.c]??9)-(order[b.c]??9));
  return normal.map(t=>t.id).concat(jokers.map(t=>t.id));
 }
 return ts.sort((a,b)=>{if(a.j!==b.j)return a.j?1:-1;if(a.n!==b.n)return a.n-b.n;return String(a.c).localeCompare(String(b.c));}).map(t=>t.id);
}

function rummiRemoveFromDraft(id){
 if(!rummiDraft)return;
 rummiDraft.hand=rummiDraft.hand.filter(x=>x!==id);
 rummiDraft.groups=rummiDraft.groups.map(gr=>gr.filter(x=>x!==id)).filter(Boolean);
}
function rummiDraftHas(id){ return (rummiDraft.hand||[]).includes(id)||(rummiDraft.groups||[]).some(gr=>gr.includes(id)); }
function rummiOwnOriginal(g){ return new Set(g.hands[me.id]||[]); }

function rummiEnsureDraft(g){
 if(rummiCurrentTurn(g)!==me.id)return;
 if(rummiDraft && rummiDraftTurn===g.turn)return;
 /* 첫 등록도 별도의 버튼을 누르는 게 아니라 바로 드래그해서 배치하는 방식 */
 rummiDraft={groups:(g.groups||[]).map(gr=>[...gr]),hand:[...(g.hands[me.id]||[])]};
 rummiDraftTurn=g.turn; rummiSelected.clear();
}
function rummiTileButton(t,selected=false,small=false,onclick='',drag=true){
 return `<button class="rummi-tile ${rummiColorClass(t.c)} ${t.j?'joker':''} ${selected?'selected':''} ${small?'small':''}"
  draggable="${drag?'true':'false'}" ondragstart="rummiDragStart(event,'${t.id}')" ondragend="rummiDragEnd(event)"
  title="${esc(rummiTileLabel(t))}" onclick="${onclick}">${rummiTileText(t)}</button>`;
}
function rummiDragStart(ev,id){
 rummiDraggedIds = (rummiSelected.has(id) && rummiSelected.size>1)
   ? [...rummiSelected]
   : [id];
 if(ev&&ev.dataTransfer){
  ev.dataTransfer.effectAllowed='move';
  ev.dataTransfer.setData('text/plain',rummiDraggedIds.join(','));
 }
}
function rummiDragEnd(){
 rummiDraggedIds=null;
 document.querySelectorAll('.rummi-drop-hover').forEach(x=>x.classList.remove('rummi-drop-hover'));
}
function rummiDragOver(ev){ ev.preventDefault(); if(ev.currentTarget)ev.currentTarget.classList.add('rummi-drop-hover'); }
function rummiDragLeave(ev){ if(ev.currentTarget)ev.currentTarget.classList.remove('rummi-drop-hover'); }
function rummiDragged(ev){
 const raw=(rummiDraggedIds&&rummiDraggedIds.length?rummiDraggedIds:null)
   || (ev&&ev.dataTransfer?ev.dataTransfer.getData('text/plain').split(',').filter(Boolean):[]);
 return Array.isArray(raw)?raw:[raw];
}
function rummiMoveIdsToGroup(ids,index,g){
 ids=[...new Set(ids)].filter(id=>g.tiles[id]);
 ids.forEach(id=>rummiRemoveFromDraft(id));
 if(!rummiDraft.groups[index])rummiDraft.groups[index]=[];
 rummiDraft.groups[index].push(...ids);
 rummiDraft.groups[index]=rummiSortGroup(rummiDraft.groups[index],g);
}
function rummiPublishDraft(g){
 if(!g || !rummiDraft || rummiCurrentTurn(g)!==me.id) return;
 g.liveGroups=(rummiDraft.groups||[]).map(gr=>rummiSortGroup([...gr],g)).filter(gr=>gr.length);
 g.liveTurn=g.turn;
}
async function rummiSyncDraft(){
 const r=data.partyRooms[roomId],g=r?.game;
 if(!g||!rummiDraft||rummiCurrentTurn(g)!==me.id)return;
 rummiPublishDraft(g);
 await put(ROOM+'/'+roomId,r);
 await get();
 render();
}
async function rummiMoveToGroup(ev,index){
 ev.preventDefault(); ev.stopPropagation();
 const r=data.partyRooms[roomId],g=r?.game,ids=rummiDragged(ev);
 if(!g||!rummiDraft||!ids.length)return;
 rummiMoveIdsToGroup(ids,index,g);
 rummiSelected.clear();
 render();
 await rummiSyncDraft();
}
async function rummiMoveToNewGroup(ev){
 ev.preventDefault(); ev.stopPropagation();
 const r=data.partyRooms[roomId],g=r?.game; let ids=rummiDragged(ev);
 if(!g||!rummiDraft||!ids.length)return;
 ids=[...new Set(ids)].filter(id=>g.tiles[id]);
 ids.forEach(id=>rummiRemoveFromDraft(id));
 rummiDraft.groups.push(rummiSortGroup(ids,g));
 rummiSelected.clear();
 render();
 await rummiSyncDraft();
}
async function rummiMoveToHand(ev){
 ev.preventDefault(); ev.stopPropagation();
 const r=data.partyRooms[roomId],g=r?.game,ids=rummiDragged(ev);
 if(!g||!rummiDraft||!ids.length)return;
 const own=rummiOwnOriginal(g);
 const originalTable=new Set(rummiAllTableIds(g));
 const allowed=[];
 for(const id of [...new Set(ids)]){
  const t=g.tiles[id];
  if(own.has(id)){ allowed.push(id); continue; }
  // 공식 규칙상 테이블의 일반 패는 손패로 가져갈 수 없다.
  // 조커는 교체/재배치 과정에서 잠시 손패 영역으로 가져올 수 있지만, 같은 턴에 반드시 새 조합에 다시 사용해야 한다.
  if(originalTable.has(id)&&t?.j){ allowed.push(id); continue; }
  return alert('테이블의 일반 패는 내 패로 가져올 수 없습니다. 조커만 교체를 위해 잠시 가져올 수 있습니다.');
 }
 allowed.forEach(id=>rummiRemoveFromDraft(id));
 rummiDraft.hand.push(...allowed);
 rummiSelected.clear();
 render();
 await rummiSyncDraft();
}

function rummiRenderGroup(group,g,index,draft=false){
 const valid=rummiValidGroup(group,g);
 const draggable=draft;
 return `<div class="rummi-group ${draft?'rummi-drop-zone':''} ${valid?'':'rummi-invalid'}"
  ondragover="rummiDragOver(event)" ondragleave="rummiDragLeave(event)" ${draft?`ondrop="rummiMoveToGroup(event,${index})"`:''}>
  <span class="rummi-group-label">${valid?'조합':'배치중'}</span>
  ${group.map(id=>{
    const t=g.tiles[id];
    return t?rummiTileButton(t,draft&&rummiSelected.has(id),!draft,`rummiSelectDraft('${id}')`,draggable):'';
  }).join('')}
  ${draft&&!group.length?'<span class="rummi-drop-hint">여기로 패를 끌어오세요</span>':''}
 </div>`;
}

function drawRummikub(r){
 const g=r.game; if(!g||!g.ids)return `<div class="notice">루미큐브 데이터를 불러오는 중...</div>`;
 g.hands = g.hands || {}; g.ids.forEach(id=>{ if(!Array.isArray(g.hands[id])) g.hands[id]=[]; });
 g.opened = g.opened || {}; g.groups = Array.isArray(g.groups)?g.groups:[];
 g.deck = Array.isArray(g.deck)?g.deck:[];
 if(typeof g.turn !== 'number') g.turn=0;
 if(!g.turnStartedAt) g.turnStartedAt=Date.now();
 const isMyTurn=rummiCurrentTurn(g)===me.id,isHost=r.host===me.id||isAdmin(),left=rummiTimeLeft(g);

 if(g.finished||r.status==='ended')return `<div class="rummi-board"><div class="rummi-title">🎲 루미큐브</div><div class="end-box"><h2>🏆 게임 종료!</h2><p>우승자: <b>${esc(name(g.winner))}</b></p><p>${esc(g.lastAction||'')}</p>${g.scores?`<div class="notice" style="text-align:left"><b>점수</b><br>${g.ids.map(id=>`${esc(name(id))}: ${g.scores[id]>0?'+':''}${g.scores[id]??0}점`).join('<br>')}</div>`:''}<div class="row"><button onclick="leaveRoom()">← 로비로 나가기</button>${isHost?'<button class="mint" onclick="backToWaitingRoom()">🏠 대기실로 돌아가기</button>':''}</div></div></div>`;

 if(isMyTurn) rummiEnsureDraft(g); else if(rummiDraftTurn!==g.turn) rummiResetLocal();
 if(isMyTurn&&!rummiTimer)rummiTimer=setInterval(rummiLocalClock,1000);

 const currentPlayer=rummiCurrentTurn(g);
 const liveTable=(g.liveTurn===g.turn && Array.isArray(g.liveGroups)) ? g.liveGroups : (g.groups||[]);
 const groups=isMyTurn&&rummiDraft ? rummiDraft.groups : liveTable;
 const hand=rummiDraft&&isMyTurn ? rummiDraft.hand : (g.hands[me.id]||[]);
 const draft=isMyTurn&&!!rummiDraft;

 const playerBar=g.ids.map(id=>`<span class="rummi-player ${id===currentPlayer?'active':''} ${id===me.id?'me':''}">${id===currentPlayer?'▶ ':''}${id===r.host?'👑 ':''}${esc(name(id))} · ${g.hands[id]?.length||0}장 ${g.opened[id]?'✓':'🔒'}</span>`).join('');
 const tableHtml=groups.length?groups.map((gr,i)=>rummiRenderGroup(gr,g,i,draft)).join(''):'<div class="rummi-empty">아직 테이블에 놓인 패가 없습니다.</div>';

 return `<div class="rummi-board">
  <div class="rummi-topbar"><div class="rummi-title">🎲 루미큐브</div><div class="rummi-status"><span class="rummi-badge">${isMyTurn?'🟢 내 차례':'⏳ 상대 차례'}</span><span class="rummi-badge rummi-clock ${left<=10?'urgent':''}" id="rummiClock">${left}초</span></div></div>
  <div class="rummi-playerbar">${playerBar}</div>
  <div class="notice" style="margin:0 0 10px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1)">
   ${isMyTurn?(g.opened[me.id]?'🎯 <b>내 차례</b> — 패를 하나 또는 여러 개 선택해 마우스로 끌어 테이블에 놓으세요. 조커도 빈 숫자 자리에 자동 정렬됩니다.':'🔰 <b>최초 등록</b> — 내 패만 하나 또는 여러 개 선택해 테이블로 끌어 합계 30 이상을 만든 뒤 확정하세요.')
   :`현재 <b>${esc(name(currentPlayer))}</b>님의 차례입니다. 테이블에 놓는 패는 실시간으로 표시됩니다.`}
  </div>
  <div class="rummi-table" ${draft?`ondragover="rummiDragOver(event)" ondragleave="rummiDragLeave(event)" ondrop="rummiMoveToNewGroup(event)"`:''}>
   ${tableHtml}
   ${draft?'<div class="rummi-new-group-drop">＋ 새 조합 만들기 · 패를 여기에 끌어오세요</div>':''}
  </div>
  <div class="rummi-rack ${draft?'rummi-work-rack rummi-drop-zone':''}" ${draft?`ondragover="rummiDragOver(event)" ondragleave="rummiDragLeave(event)" ondrop="rummiMoveToHand(event)"`:''}>
   <div class="rummi-rack-title"><span>🪵 내 패 (${hand.length})</span><span>${isMyTurn?'여러 장 선택 후 한 번에 드래그 가능':'상대 차례 · 내 패 보기'}</span></div>
   <div class="rummi-hand">${hand.map(id=>g.tiles[id]?rummiTileButton(g.tiles[id],draft&&rummiSelected.has(id),false,draft?`rummiSelectDraft('${id}')`:'' ,draft):'').join('')}</div>
  </div>
  <div class="rummi-actions">${isMyTurn?`<button class="gold" onclick="rummiCommitTurn()">✅ 내려놓기 / 턴 확정</button><button class="danger" onclick="rummiUndoTurn()">↩️ 되돌리기</button><button onclick="rummiDraw()">➕ 패 1장 먹기</button>`:'<div class="notice" style="margin:0;width:100%">⏳ '+esc(name(currentPlayer))+'님의 차례입니다. '+left+'초 · 내 패는 계속 보입니다.</div>'}</div>
  <div class="rummi-tools"><button onclick="rummiSortNumber()">777 · 숫자순</button><button onclick="rummiSortColor()">789 · 색깔순</button><button onclick="rummiClearSelection()">선택 해제</button></div>
  <div class="rummi-help"><b>정식 규칙:</b> 그룹은 같은 숫자·서로 다른 색 3~4장, 런은 같은 색 연속 숫자 3장 이상입니다. 최초 등록은 내 패만으로 30점 이상이며 조커도 사용할 수 있습니다. 최초 등록 후에는 테이블을 자유롭게 재배열할 수 있지만 그 턴에 내 패를 최소 1장 사용해야 합니다. 테이블의 조커는 초기 등록 전에는 회수할 수 없고, 회수한 조커는 같은 턴에 반드시 새 조합으로 다시 사용해야 합니다. 방금 먹은 패는 다음 턴부터 사용할 수 있습니다.</div>
  ${g.lastAction?`<div class="notice" style="margin-bottom:0;background:rgba(0,0,0,.18)">📢 ${esc(g.lastAction)}</div>`:''}
 </div>`;
}

function rummiSelectDraft(id){ if(!rummiDraft)return; rummiSelected.has(id)?rummiSelected.delete(id):rummiSelected.add(id); render(); }
function rummiSelectRack(id){rummiSelectDraft(id)}
function rummiSelectTable(id){rummiSelectDraft(id)}
function rummiClearSelection(){rummiSelected.clear();render();}

async function rummiSortNumber(){
 const r=data.partyRooms[roomId],g=r?.game;if(!g||rummiCurrentTurn(g)!==me.id)return;rummiEnsureDraft(g);
 rummiDraft.hand.sort((a,b)=>{const A=g.tiles[a],B=g.tiles[b];if(A.j!==B.j)return A.j?1:-1;if(A.n!==B.n)return A.n-B.n;return String(A.c).localeCompare(String(B.c));});render();
}
async function rummiSortColor(){
 const r=data.partyRooms[roomId],g=r?.game;if(!g||rummiCurrentTurn(g)!==me.id)return;rummiEnsureDraft(g);const order={R:0,B:1,O:2,K:3,J:4};
 rummiDraft.hand.sort((a,b)=>{const A=g.tiles[a],B=g.tiles[b];if(order[A.c]!==order[B.c])return order[A.c]-order[B.c];return (A.n||99)-(B.n||99);});render();
}

/* 첫 등록/일반 턴 모두 하나의 확정 버튼으로 처리 */
async function rummiCommitTurn(){
 const r=data.partyRooms[roomId],g=r?.game;if(!g||rummiCurrentTurn(g)!==me.id||!rummiDraft)return;
 const originalTable=new Set(rummiAllTableIds(g)), originalHand=new Set(g.hands[me.id]||[]);
 const originalTableJokers=new Set([...originalTable].filter(id=>g.tiles[id]?.j));
 const allSource=new Set([...originalTable,...originalHand]);
 const finalTable=new Set(rummiDraft.groups.flat()), finalHand=new Set(rummiDraft.hand);
 if(finalTable.size+finalHand.size!==allSource.size||[...allSource].some(id=>!finalTable.has(id)&&!finalHand.has(id)))
  return alert('패가 사라졌거나 중복되었습니다. 다시 배치해주세요.');
 if([...finalHand].some(id=>!originalHand.has(id)))
  return alert('테이블의 패는 손패로 가져갈 수 없습니다. 조커를 회수했다면 같은 턴에 반드시 새 조합으로 다시 사용하세요.');
 if(!g.opened[me.id]){
  if([...finalTable].some(id=>!originalHand.has(id)))return alert('최초 등록에서는 다른 사람이 놓은 패를 사용할 수 없습니다.');
  const value=rummiInitialValue(rummiDraft.groups,g);
  if(value<30)return alert(`최초 등록 합계가 ${value}점입니다. 30점 이상이어야 합니다.`);
  g.opened[me.id]=true;
  g.lastAction=`${name(me.id)}님이 ${value}점으로 최초 등록에 성공했습니다!`;
 } else {
  const addedFromRack=[...finalTable].some(id=>originalHand.has(id));
  const changed=JSON.stringify(g.groups)!==JSON.stringify(rummiDraft.groups);
  if(!addedFromRack&&!changed)return alert('이번 턴에는 내 패를 최소 1장 사용해야 합니다. 아무것도 하지 않으려면 패 1장을 먹으세요.');
 }
 // 초기 등록 전에는 조커를 테이블에서 회수할 수 없다. 초기 등록 후 회수한 조커는 반드시 같은 턴 새 조합으로 재사용해야 한다.
 for(const jid of originalTableJokers){
  if(finalHand.has(jid))return alert('테이블의 조커는 손패에 남겨둘 수 없습니다. 교체한 뒤 같은 턴에 새 조합으로 사용해야 합니다.');
 }
 const cleanGroups=rummiDraft.groups.filter(gr=>Array.isArray(gr)&&gr.length).map(gr=>rummiSortGroup([...new Set(gr)],g));
 const check=rummiValidateGroups(cleanGroups,g); if(!check.ok)return alert(check.reason);
 g.groups=cleanGroups;
 g.hands[me.id]=rummiDraft.hand.filter(id=>originalHand.has(id));
 delete g.liveGroups; delete g.liveTurn;
 g.consecutivePasses=0;
 rummiResetLocal();
 if(g.hands[me.id].length===0){
  rummiFinishByEmptyRack(r,me.id);
 } else {
  g.turn=(g.turn+1)%g.ids.length;
  g.turnStartedAt=Date.now();
  g.lastAction=`${name(me.id)}님이 턴을 확정했습니다.`;
 }
 await put(ROOM+'/'+roomId,r);await get();render();
}

async function rummiUndoTurn(){
 const r=data.partyRooms[roomId],g=r?.game;
 if(!g||rummiCurrentTurn(g)!==me.id)return;
 delete g.liveGroups; delete g.liveTurn;
 rummiResetLocal();
 await put(ROOM+'/'+roomId,r); await get(); render();
}

async function rummiDraw(){
 const r=data.partyRooms[roomId],g=r?.game;if(!g||rummiCurrentTurn(g)!==me.id)return;
 if(!g.deck.length){
  // 풀이 비었으면 더 이상 먹을 수 없다. 한 바퀴 동안 누구도 유효한 수를 못 만들면 종료.
  g.consecutivePasses=Number(g.consecutivePasses||0)+1;
  if(g.consecutivePasses>=g.ids.length){
   rummiFinishByNoMoves(r);
  } else {
   g.lastAction=`${name(me.id)}님은 먹을 패가 없어 차례를 넘겼습니다.`;
   g.turn=(g.turn+1)%g.ids.length;g.turnStartedAt=Date.now();
  }
  rummiResetLocal();await put(ROOM+'/'+roomId,r);await get();render();return;
 }
 const tid=g.deck.pop();
 g.hands[me.id].push(tid);
 g.consecutivePasses=0;
 delete g.liveGroups; delete g.liveTurn;
 g.lastDraw={player:me.id,tile:tid};
 g.lastAction=`${name(me.id)}님이 패 1장을 먹었습니다.`;
 g.turn=(g.turn+1)%g.ids.length;g.turnStartedAt=Date.now();
 rummiResetLocal();await put(ROOM+'/'+roomId,r);await get();render();
}

function rummiLocalClock(){
 if(!roomId)return;const r=data.partyRooms[roomId];if(!r||r.type!=='rummikub'||r.status!=='playing'||!r.game)return;const g=r.game,left=rummiTimeLeft(g),el=$('rummiClock');if(el){el.textContent=left+'초';el.classList.toggle('urgent',left<=10);}if(rummiCurrentTurn(g)===me.id&&left<=0&&!g.finished&&!rummiTimeoutLock){rummiTimeoutLock=true;rummiAutoTimeout();}
}
let rummiTimeoutLock=false;
async function rummiAutoTimeout(){
 const r=data.partyRooms[roomId],g=r?.game;if(!g||rummiCurrentTurn(g)!==me.id||rummiTimeLeft(g)>0||g.finished){rummiTimeoutLock=false;return;}
 if(g.deck.length){
  g.hands[me.id].push(g.deck.pop());
  g.consecutivePasses=0;
  delete g.liveGroups; delete g.liveTurn;
  g.lastAction=`${name(me.id)}님이 시간 초과되어 배치를 취소하고 패 1장을 먹었습니다.`;
  g.turn=(g.turn+1)%g.ids.length;g.turnStartedAt=Date.now();
 } else {
  g.consecutivePasses=Number(g.consecutivePasses||0)+1;
  if(g.consecutivePasses>=g.ids.length){ rummiFinishByNoMoves(r); }
  else { g.lastAction=`${name(me.id)}님이 시간 초과되었고 먹을 패가 없어 차례를 넘겼습니다.`; g.turn=(g.turn+1)%g.ids.length;g.turnStartedAt=Date.now(); }
 }
 rummiResetLocal();rummiTimeoutLock=false;await put(ROOM+'/'+roomId,r);await get();render();
}

async function setRummikubTurnLimit(sec){const r=data.partyRooms[roomId];if(!r||r.type!=='rummikub')return;if(r.host!==me.id&&!isAdmin())return alert('방장만 턴 시간을 바꿀 수 있습니다.');if(r.status!=='waiting')return alert('게임 시작 후에는 턴 시간을 바꿀 수 없습니다.');r.turnLimit=sec===60?60:30;r.chat=r.chat||[];r.chat.push({id:'system',text:`⏱️ 루미큐브 턴 제한시간이 ${r.turnLimit===60?'1분':'30초'}로 설정되었습니다.`});await put(ROOM+'/'+roomId,r);await get();render();}

</script>
