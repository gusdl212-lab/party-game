<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>파티 게임 라운지 v2.4</title>

<style>
*{
 box-sizing:border-box;
 font-family:system-ui,-apple-system,"Pretendard",sans-serif
}

body{
 margin:0;
 background:#10131f;
 color:#edf2f7;
 min-height:100vh
}

.app{
 max-width:1160px;
 margin:auto;
 padding:24px
}

header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 background:linear-gradient(110deg,#202a4a,#44235c);
 padding:20px 24px;
 border-radius:20px;
 border:1px solid #7486cf
}

h1{
 margin:0;
 font-size:26px
}

.tag{
 color:#b9c7ff;
 font-size:13px
}

.hidden{
 display:none!important
}

.card{
 background:#181d2e;
 border:1px solid #303a58;
 border-radius:15px;
 padding:18px
}

.grid{
 display:grid;
 grid-template-columns:250px 1fr 260px;
 gap:14px;
 margin-top:15px
}

.room-grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:12px
}

.game{
 border:1px solid #39476b;
 border-radius:14px;
 padding:15px;
 background:linear-gradient(145deg,#1e2740,#161b2b)
}

button{
 border:0;
 border-radius:9px;
 padding:10px 13px;
 background:#7184e8;
 color:white;
 font-weight:800;
 cursor:pointer
}

button:hover{
 filter:brightness(1.12)
}

button:disabled{
 opacity:.45;
 cursor:not-allowed
}

.danger{
 background:#de5570
}

.gold{
 background:#d89b3a
}

.mint{
 background:#25a99a
}

input,select,textarea{
 width:100%;
 border:1px solid #44547b;
 background:#101523;
 color:white;
 padding:10px;
 border-radius:8px;
 margin:5px 0
}

.list{
 max-height:480px;
 overflow:auto
}

.item{
 padding:9px;
 border-bottom:1px solid #2b344d;
 font-size:13px
}

.online{
 color:#62e6b2
}

.dot{
 width:8px;
 height:8px;
 background:#62e6b2;
 border-radius:50%;
 display:inline-block;
 margin-right:5px
}

.row{
 display:flex;
 gap:8px;
 align-items:center
}

.row>*{
 flex:1
}

.top{
 display:flex;
 justify-content:space-between;
 gap:8px;
 align-items:center
}

.notice{
 padding:11px;
 background:#101725;
 border-radius:9px;
 color:#bcc7e8;
 margin:10px 0
}

.players{
 display:flex;
 flex-wrap:wrap;
 gap:8px
}

.player{
 padding:7px 10px;
 background:#273252;
 border-radius:99px;
 font-size:13px
}

.chat{
 height:170px;
 overflow:auto;
 background:#101523;
 border-radius:8px;
 padding:9px
}

.chat p{
 margin:4px 0;
 font-size:13px
}

.mine{
 color:#94b9ff
}

.tiles{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin:10px 0
}

.tile{
 min-width:48px;
 padding:12px 8px;
 border-radius:9px;
 text-align:center;
 font-weight:900;
 background:#f4eee1;
 color:#26324a;
 border:2px solid #c7b58f;
 font-size:16px;
 cursor:pointer
}

.tile.red{
 color:#c53c4b
}

.tile.blue{
 color:#2585bd
}

.map-box{
 border:1px solid #4a5c8b;
 background:#111827;
 border-radius:12px;
 padding:15px;
 margin-bottom:15px
}

.map-title{
 font-size:13px;
 color:#aeb9d7;
 margin-bottom:6px
}

.map-select{
 font-size:16px;
 font-weight:800;
 margin:0
}

.end-box{
 text-align:center;
 padding:25px;
 background:#111827;
 border-radius:12px;
 border:1px solid #4a5c8b
}

@media(max-width:800px){
 .grid{
  grid-template-columns:1fr
 }
 .app{
  padding:12px
 }
 header{
  align-items:flex-start;
  gap:10px;
  flex-direction:column
 }
}
</style>
</head>

<body>

<div class="app">

<header>
 <div>
  <h1>🎉 파티 게임 라운지</h1>
  <div class="tag">
   다빈치 코드 · 마피아 · 라이어 게임 · v2.4
  </div>
 </div>
 <div id="who" class="tag"></div>
</header>

<!-- 로그인 -->
<section id="auth" class="card" style="max-width:420px;margin:40px auto">
 <h2>입장하기</h2>
 <input id="id" placeholder="아이디 (2~20자)">
 <input id="pw" type="password" placeholder="비밀번호 (4자 이상)">
 <div class="row">
  <button onclick="login()">로그인</button>
  <button class="mint" onclick="signup()">회원가입</button>
 </div>
</section>

<!-- 로비 -->
<section id="lobby" class="hidden">
 <div class="grid">
  <aside class="card">
   <div class="top">
    <h3>👥 회원 목록</h3>
    <span id="memberCount" class="small"></span>
   </div>
   <div id="members" class="list"></div>
  </aside>

  <main class="card">
   <div class="top">
    <div>
     <h2 style="margin:0">🎮 게임 방</h2>
     <span class="small">방을 만들고 맵을 선택하세요.</span>
    </div>
    <button onclick="createRoom()">+ 방 만들기</button>
   </div>
   <div id="rooms" class="room-grid" style="margin-top:16px"></div>
  </main>

  <aside class="card">
   <div class="top">
    <h3>🟢 실시간 접속자</h3>
    <span id="onlineCount" class="small"></span>
   </div>
   <div id="online" class="list"></div>
   <button class="danger" style="margin-top:12px" onclick="logout()">로그아웃</button>
  </aside>
 </div>
</section>

<!-- 방 -->
<section id="roomView" class="hidden">
 <div class="card">
  <div class="top">
   <div>
    <button onclick="leaveRoom()">← 로비</button>
    <span id="roomTitle"></span>
   </div>
   <div id="hostControls"></div>
  </div>

  <div class="grid" style="grid-template-columns:220px 1fr 260px">
   <aside class="card">
    <h3>참가자</h3>
    <div id="players" class="players"></div>
    <p id="roomInfo" class="small"></p>
   </aside>

   <main class="card">
    <div id="gameArea"></div>
   </main>

   <aside class="card">
    <h3>💬 방 채팅</h3>
    <div id="chat" class="chat"></div>
    <input id="chatInput" placeholder="메시지 입력" onkeydown="if(event.key==='Enter')sendChat()">
    <button onclick="sendChat()">전송</button>
   </aside>
  </div>
 </div>
</section>

</div>

<script>
const BASE = 'https://andy-5cb5e-default-rtdb.firebaseio.com/othello_platform';
const ROOM = 'partyRooms';
const ADMIN_ID = 'andy212';

let me = null;
let roomId = null;
let tick = null;
let data = { users: {}, partyRooms: {}, partyPresence: {} };

const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function isAdmin(){ return !!(me && me.id === ADMIN_ID); }

async function get(){
 try{
  const r = await fetch(BASE + '.json');
  const v = await r.json();
  data = {
   users: v?.users || {},
   partyRooms: v?.[ROOM] || {},
   partyPresence: v?.partyPresence || {}
  };
 }catch(e){ console.error(e); }
}

async function put(path, value){
 try{
  const r = await fetch(BASE + '/' + path + '.json', {
   method: 'PUT',
   headers: { 'Content-Type': 'application/json' },
   body: JSON.stringify(value)
  });
  return r.ok;
 }catch(e){ console.error(e); return false; }
}

function show(id){
 ['auth','lobby','roomView'].forEach(x => {
  $(x).classList.toggle('hidden', x !== id);
 });
}

function name(id){ return id === ADMIN_ID ? '관리자' : id; }

async function signup(){
 const id = $('id').value.trim();
 const pw = $('pw').value;
 if(!/^[a-zA-Z0-9가-힣_]{2,20}$/.test(id) || pw.length < 4){
  return alert('아이디는 2~20자, 비밀번호는 4자 이상으로 입력하세요.');
 }
 await get();
 if(data.users[id]) return alert('이미 있는 아이디입니다.');
 await put('users/' + encodeURIComponent(id), { id:id, pw:pw, joinedAt:Date.now(), lastActive:Date.now() });
 me = { id:id, pw:pw };
 await enter();
}

async function login(){
 const id = $('id').value.trim();
 const pw = $('pw').value;
 await get();
 const u = data.users[id];
 if(!u || u.pw !== pw) return alert('아이디 또는 비밀번호가 맞지 않습니다.');
 me = { id:id, pw:pw };
 await enter();
}

async function enter(){
 localStorage.partyUser = JSON.stringify(me);
 await heartbeat();
 show('lobby');
 render();
 if(tick) clearInterval(tick);
 tick = setInterval(async () => {
  if(!me) return;
  await get();
  await heartbeat();
  render();
 }, 2000);
}

async function heartbeat(){
 if(!me) return;
 await put('partyPresence/' + encodeURIComponent(me.id), { id:me.id, lastActive:Date.now() });
 if(data.users[me.id]){
  await put('users/' + encodeURIComponent(me.id) + '/lastActive', Date.now());
 }
}

async function logout(){
 if(!me) return;
 await put('partyPresence/' + encodeURIComponent(me.id), null);
 localStorage.removeItem('partyUser');
 me = null; roomId = null;
 if(tick) clearInterval(tick);
 tick = null;
 show('auth');
}

function active(){
 const now = Date.now();
 return Object.values(data.partyPresence || {}).filter(x => x && now - x.lastActive < 15000);
}

function render(){
 if(!me) return;
 $('who').textContent = '👤 ' + name(me.id) + (isAdmin() ? ' 👑 관리자' : '');
 if(roomId && data.partyRooms[roomId]){
  renderRoom(data.partyRooms[roomId]);
 } else {
  roomId = null;
  show('lobby');
  renderLobby();
 }
}

function renderLobby(){
 const users = Object.values(data.users || {}).sort((a,b) => (b.lastActive||0) - (a.lastActive||0));
 const online = active();
 $('memberCount').textContent = users.length + '명';

 $('members').innerHTML = users.map(u => {
  const isOnline = online.some(x => x.id === u.id);
  return `<div class="item"><span>${isOnline ? '<span class="dot"></span>' : '⚪ '} ${u.id===ADMIN_ID?'👑 ':''}${esc(name(u.id))}</span></div>`;
 }).join('') || '<p class="small">회원이 없습니다.</p>';

 $('onlineCount').textContent = online.length + '명';
 $('online').innerHTML = online.map(u => `
  <div class="item online"><span><span class="dot"></span>${esc(name(u.id))}</span></div>
 `).join('') || '<p class="small">접속자가 없습니다.</p>';

 const rooms = Object.entries(data.partyRooms || {}).filter(([,r]) => r && r.status !== 'ended');
 $('rooms').innerHTML = rooms.map(([id,r]) => {
  const count = Object.keys(r.players || {}).length;
  return `
   <div class="game">
    <b>🎮 ${esc(r.title)}</b>
    <p class="small">
     현재 맵: ${icon(r.type)} ${label(r.type)}<br>
     ${count}/${limit(r.type)}명 · ${r.status==='waiting'?'대기 중':'게임 진행 중'}
    </p>
    <button onclick="joinRoom('${id}')" ${r.status!=='waiting'&&!isAdmin()?'disabled':''}>
     ${isAdmin()?'관리자로 입장':'참가하기'}
    </button>
   </div>
  `;
 }).join('') || '<div class="notice">아직 열린 방이 없어요. 첫 번째 방장이 되어 보세요!</div>';
}

function icon(type){
 if(type==='davinci') return '🧩';
 if(type==='mafia') return '🌙';
 return '🕵️';
}

function label(type){
 if(type==='davinci') return '다빈치 코드';
 if(type==='mafia') return '마피아';
 return '라이어 게임';
}

function limit(type){
 if(type==='davinci') return 4;
 if(type==='mafia') return 10;
 return 8;
}

function minPlayers(type){
 if(type==='davinci') return 2;
 if(type==='mafia') return 4;
 return 3;
}

async function createRoom(){
 const title = prompt('방 제목을 입력하세요.', '즐거운 게임 방');
 if(title === null) return;
 const finalTitle = title.trim() || '파티 게임 방';
 const id = 'p' + Date.now();
 const room = {
  id: id,
  title: finalTitle,
  type: 'davinci',
  host: me.id,
  status: 'waiting',
  createdAt: Date.now(),
  players: { [me.id]: { id: me.id } },
  chat: [{ id: 'system', text: name(me.id) + '님이 방을 만들었습니다.' }]
 };
 const ok = await put(ROOM + '/' + id, room);
 if(!ok) return alert('방 생성에 실패했습니다.');
 roomId = id;
 await get();
 render();
}

async function joinRoom(id){
 let r = data.partyRooms[id];
 if(!r) return alert('방을 찾을 수 없습니다.');
 if(isAdmin()){
  r.players = r.players || {};
  r.players[me.id] = { id: me.id };
  r.host = me.id;
  await put(ROOM + '/' + id, r);
  roomId = id;
  await get();
  render();
  return;
 }
 if(r.status !== 'waiting') return alert('이미 게임이 시작된 방입니다.');
 if(Object.keys(r.players || {}).length >= limit(r.type)) return alert('방이 가득 찼습니다.');
 r.players = r.players || {};
 r.players[me.id] = { id: me.id };
 await put(ROOM + '/' + id, r);
 roomId = id;
 await get();
 render();
}

async function leaveRoom(){
 if(!roomId) return;
 const r = data.partyRooms[roomId];
 if(!r){ roomId = null; render(); return; }
 if(r.players) delete r.players[me.id];
 const remain = Object.keys(r.players || {});
 if(remain.length === 0){
  await put(ROOM + '/' + roomId, null);
 } else {
  if(r.host === me.id){
   r.host = remain[0];
   r.chat = r.chat || [];
   r.chat.push({ id: 'system', text: name(r.host) + '님이 새로운 방장이 되었습니다.' });
  }
  await put(ROOM + '/' + roomId, r);
 }
 roomId = null;
 await get();
 render();
}

async function changeMap(type){
 if(!roomId) return;
 const r = data.partyRooms[roomId];
 if(!r) return;
 if(r.host !== me.id && !isAdmin()) return alert('방장만 맵을 변경할 수 있습니다.');
 if(r.status !== 'waiting') return alert('게임이 시작된 후에는 맵을 변경할 수 없습니다.');
 r.type = type;
 delete r.game;
 r.chat = r.chat || [];
 r.chat.push({ id: 'system', text: '게임 맵이 ' + label(type) + '으로 변경되었습니다.' });
 await put(ROOM + '/' + roomId, r);
 await get();
 render();
}

async function startGame(){
 const r = data.partyRooms[roomId];
 if(!r) return;
 if(r.host !== me.id && !isAdmin()) return alert('방장만 게임을 시작할 수 있습니다.');
 
 const ids = Object.keys(r.players || {});
 const min = minPlayers(r.type);
 if(ids.length < min) return alert(label(r.type) + '은 최소 ' + min + '명이 필요합니다.');

 if(r.type === 'davinci'){
  r.game = createDavinci(ids);
 } else if(r.type === 'mafia'){
  r.game = createMafia(ids);
 } else if(r.type === 'liar'){
  r.game = createLiar(ids);
 }

 r.status = 'playing';
 r.startedAt = Date.now();
 r.chat = r.chat || [];
 r.chat.push({ id: 'system', text: '🎮 ' + label(r.type) + ' 게임이 시작되었습니다!' });

 const ok = await put(ROOM + '/' + roomId, r);
 if(!ok) return alert('게임 시작에 실패했습니다.');
 await get();
 render();
}

async function sendChat(){
 const input = $('chatInput');
 const text = input.value.trim();
 if(!text || !roomId) return;
 const r = data.partyRooms[roomId];
 if(!r) return;
 r.chat = r.chat || [];
 r.chat.push({ id: me.id, text: text });
 input.value = '';
 await put(ROOM + '/' + roomId, r);
 await get();
 render();
}

function renderRoom(r){
 show('roomView');
 $('roomTitle').innerHTML = `<b>🎮 ${esc(r.title)}</b>`;

 $('players').innerHTML = Object.keys(r.players || {}).map(id => `
  <span class="player">
   ${id===r.host?'👑 ':''}
   ${id===ADMIN_ID?'관리자':esc(name(id))}
  </span>
 `).join('');

 $('roomInfo').textContent = Object.keys(r.players || {}).length + '/' + limit(r.type) + '명 · ' + (r.status==='waiting'?'게임 시작 전':'게임 진행 중');

 const canControl = r.host === me.id || isAdmin();
 if(canControl && r.status === 'waiting'){
  $('hostControls').innerHTML = `<button class="gold" onclick="startGame()">▶ 게임 시작</button>`;
 } else {
  $('hostControls').innerHTML = '';
 }

 $('chat').innerHTML = (r.chat || []).slice(-50).map(m => `
  <p class="${m.id===me.id?'mine':''}">
   <b>${m.id==='system'?'📢':esc(name(m.id))}</b>
   ${esc(m.text)}
  </p>
 `).join('');
 $('chat').scrollTop = $('chat').scrollHeight;

 if(r.status === 'playing'){
  if(!r.game){
   $('gameArea').innerHTML = `<div class="notice">게임 데이터를 불러오는 중입니다...</div>`;
   return;
  }
  if(r.type === 'davinci'){
   $('gameArea').innerHTML = drawDavinci(r);
  } else if(r.type === 'mafia'){
   $('gameArea').innerHTML = drawMafia(r);
  } else {
   $('gameArea').innerHTML = drawLiar(r);
  }
 } else if(r.status === 'waiting'){
  drawWaitingRoom(r);
 } else if(r.status === 'ended'){
  $('gameArea').innerHTML = drawEnded(r);
 }
}

function drawWaitingRoom(r){
 const canControl = r.host === me.id || isAdmin();
 $('gameArea').innerHTML = `
  <div class="map-box">
   <div class="map-title">🗺️ 현재 선택된 맵</div>
   <h2 style="margin:5px 0 12px">${icon(r.type)} ${label(r.type)}</h2>
   ${canControl ? `
    <select class="map-select" onchange="changeMap(this.value)">
     <option value="davinci" ${r.type==='davinci'?'selected':''}>🧩 다빈치 코드</option>
     <option value="mafia" ${r.type==='mafia'?'selected':''}>🌙 마피아</option>
     <option value="liar" ${r.type==='liar'?'selected':''}>🕵️ 라이어 게임</option>
    </select>
    <p class="small">방장만 게임 맵을 변경할 수 있습니다.</p>
   ` : `
    <div class="notice">방장이 맵을 선택하고 있습니다.<br>현재 선택: <b>${icon(r.type)} ${label(r.type)}</b></div>
   `}
  </div>
  <div class="notice">
   <b>참가자 ${Object.keys(r.players||{}).length}명</b><br>
   최소 ${minPlayers(r.type)}명이 모이면 게임을 시작할 수 있습니다.
  </div>
  ${canControl ? `<button class="gold" style="width:100%; margin-top:10px;" onclick="startGame()">▶ ${label(r.type)} 게임 시작</button>` : `<div class="notice">방장이 게임을 시작할 때까지 기다려 주세요.</div>`}
 `;
}

function drawEnded(r){
 return `
  <div class="end-box">
   <h2>🎉 게임 종료</h2>
   <p>${icon(r.type)} ${label(r.type)}</p>
   <div class="notice">게임이 종료되었습니다.</div>
   <button onclick="leaveRoom()">← 방으로 돌아가기</button>
  </div>
 `;
}

function shuffle(arr){
 return [...arr].sort(() => Math.random() - .5);
}

/* ================= 다빈치 코드 로직 ================= */
function createDavinci(ids){
 let deck = [];
 for(let n = 0; n < 12; n++){
  deck.push('🔴 ' + n);
  deck.push('🔵 ' + n);
 }
 deck = shuffle(deck);
 let hands = {};
 ids.forEach(id => {
  hands[id] = deck.splice(0, 4).sort(tileSort);
 });
 return {
  ids: ids,
  hands: hands,
  deck: deck,
  turn: 0,
  revealed: {},
  finished: false
 };
}

function tileNumber(tile){
 const m = String(tile).match(/\d+/);
 return m ? Number(m[0]) : 0;
}

function tileSort(a, b){
 return tileNumber(a) - tileNumber(b);
}

function drawDavinci(r){
 const g = r.game;
 if(!g || !g.ids) return `<div class="notice">게임 데이터를 불러오는 중...</div>`;
 
 g.revealed = g.revealed || {};
 const turn = g.ids[g.turn % g.ids.length];
 const my = g.hands[me.id] || [];
 const opponents = g.ids.filter(id => id !== me.id);

 return `
  <h2>🧩 다빈치 코드</h2>
  <div class="notice">
   ${turn === me.id ? '🟢 당신의 차례입니다!' : '⏳ ' + esc(name(turn)) + '님의 차례입니다.'}
  </div>

  <h3>내 타일</h3>
  <div class="tiles">
   ${my.map(x => `<span class="tile ${x.startsWith('🔴')?'red':'blue'}">${esc(x)}</span>`).join('')}
  </div>

  <h3>상대 타일</h3>
  ${opponents.map(id => `
   <div class="notice">
    <b>${esc(name(id))}</b><br>
    <div class="tiles">
     ${(g.hands[id] || []).map((x, i) => {
      const isRev = g.revealed[id] && g.revealed[id][i];
      return `
       <button class="tile ${x.startsWith('🔴')?'red':'blue'}" ${turn !== me.id ? 'disabled' : ''} onclick="guessDavinci('${id}',${i})">
        ${isRev ? esc(x) : '?'}
       </button>
      `;
     }).join('')}
    </div>
   </div>
  `).join('')}

  <div class="row">
   <button ${turn !== me.id || !g.deck.length ? 'disabled' : ''} onclick="drawDavinciTile()">
    타일 뽑기 (${g.deck.length})
   </button>
   <button class="mint" ${turn !== me.id ? 'disabled' : ''} onclick="passDavinciTurn()">
    추리 안 함
   </button>
  </div>
  <p class="small" style="margin-top:10px">상대의 ? 타일을 눌러 숫자를 추리하세요.</p>
 `;
}

async function drawDavinciTile(){
 const r = data.partyRooms[roomId];
 const g = r.game;
 const turn = g.ids[g.turn % g.ids.length];
 if(turn !== me.id || !g.deck.length) return;

 const tile = g.deck.pop();
 g.hands[me.id].push(tile);
 g.hands[me.id].sort(tileSort);
 g.turn = (g.turn + 1) % g.ids.length;

 await put(ROOM + '/' + roomId, r);
 await get();
 render();
}

async function passDavinciTurn(){
 const r = data.partyRooms[roomId];
 const g = r.game;
 const turn = g.ids[g.turn % g.ids.length];
 if(turn !== me.id) return;

 g.turn = (g.turn + 1) % g.ids.length;
 await put(ROOM + '/' + roomId, r);
 await get();
 render();
}

async function guessDavinci(id, index){
 const r = data.partyRooms[roomId];
 const g = r.game;
 const turn = g.ids[g.turn % g.ids.length];
 if(turn !== me.id) return;

 const answer = prompt(name(id) + '님의 ' + (index + 1) + '번째 타일 숫자를 입력하세요.\n(0~11)');
 if(answer === null) return;

 const actual = tileNumber(g.hands[id][index]);
 g.revealed = g.revealed || {};
 g.revealed[id] = g.revealed[id] || {};

 if(Number(answer.trim()) === actual){
  g.revealed[id][index] = true;
  
  const allOpen = g.hands[id].every((_, i) => g.revealed[id][i]);
  if(allOpen){
   r.status = 'ended';
   g.finished = true;
   g.winner = me.id;
  }
 } else {
  g.turn = (g.turn + 1) % g.ids.length;
 }

 await put(ROOM + '/' + roomId, r);
 await get();
 render();
}

function createMafia(ids){ return { ids }; }
function drawMafia(r){ return `<h2>🌙 마피아 게임 준비 중</h2>`; }
function createLiar(ids){ return { ids }; }
function drawLiar(r){ return `<h2>🕵️ 라이어 게임 준비 중</h2>`; }
</script>
</body>
</html>
