<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>파티 게임 라운지 v1.0</title><style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,"Pretendard",sans-serif}body{margin:0;background:#10131f;color:#edf2f7;min-height:100vh}.app{max-width:1160px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(110deg,#202a4a,#44235c);padding:20px 24px;border-radius:20px;border:1px solid #7486cf}h1{margin:0;font-size:26px}.tag{color:#b9c7ff;font-size:13px}.hidden{display:none!important}.card{background:#181d2e;border:1px solid #303a58;border-radius:15px;padding:18px}.grid{display:grid;grid-template-columns:250px 1fr 260px;gap:14px;margin-top:15px}.room-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.game{border:1px solid #39476b;border-radius:14px;padding:15px;background:linear-gradient(145deg,#1e2740,#161b2b)}button{border:0;border-radius:9px;padding:10px 13px;background:#7184e8;color:white;font-weight:800;cursor:pointer}button:hover{filter:brightness(1.12)}button:disabled{opacity:.45;cursor:not-allowed}.danger{background:#de5570}.gold{background:#d89b3a}.mint{background:#25a99a}input,select,textarea{width:100%;border:1px solid #44547b;background:#101523;color:white;padding:10px;border-radius:8px;margin:5px 0}textarea{min-height:60px;resize:vertical}.list{max-height:480px;overflow:auto}.item{padding:9px;border-bottom:1px solid #2b344d;font-size:13px}.online{color:#62e6b2}.dot{width:8px;height:8px;background:#62e6b2;border-radius:50%;display:inline-block;margin-right:5px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.notice{padding:11px;background:#101725;border-radius:9px;color:#bcc7e8;margin:10px 0}.players{display:flex;flex-wrap:wrap;gap:8px}.player{padding:7px 10px;background:#273252;border-radius:99px;font-size:13px}.chat{height:170px;overflow:auto;background:#101523;border-radius:8px;padding:9px}.chat p{margin:4px 0;font-size:13px}.mine{color:#94b9ff}.tiles{display:flex;flex-wrap:wrap;gap:8px}.tile{min-width:48px;padding:9px 7px;border-radius:9px;text-align:center;font-weight:900;background:#f4eee1;color:#26324a;border:2px solid #c7b58f}.tile.red{color:#c53c4b}.tile.blue{color:#2585bd}.role{font-size:22px;text-align:center;padding:18px;background:#11182a;border-radius:12px}.vote{margin:4px;width:auto}.clue{padding:8px;background:#263252;border-radius:7px;margin:5px 0}.small{font-size:12px;color:#aeb9d7}@media(max-width:800px){.grid{grid-template-columns:1fr}.app{padding:12px}header{align-items:flex-start;gap:10px;flex-direction:column}}
</style></head><body><div class="app"><header><div><h1>🎉 파티 게임 라운지</h1><div class="tag">다빈치 코드 · 마피아 · 라이어 게임 · v1.0</div></div><div id="who" class="tag"></div></header>
<section id="auth" class="card" style="max-width:420px;margin:40px auto"><h2>입장하기</h2><input id="id" placeholder="아이디 (2~20자)"><input id="pw" type="password" placeholder="비밀번호 (4자 이상)"><div class="row"><button onclick="login()">로그인</button><button class="mint" onclick="signup()">회원가입</button></div><p class="small">기존 게임과 같은 회원 계정을 사용합니다.</p></section>
<section id="lobby" class="hidden"><div class="grid"><aside class="card"><div class="top"><h3>👥 회원 목록</h3><span id="memberCount" class="small"></span></div><div id="members" class="list"></div></aside><main class="card"><div class="top"><div><h2 style="margin:0">🎮 게임 방</h2><span class="small">원하는 게임을 골라 방을 만들거나 참가하세요.</span></div><button onclick="createRoom()">+ 방 만들기</button></div><div id="rooms" class="room-grid" style="margin-top:16px"></div></main><aside class="card"><div class="top"><h3>🟢 실시간 접속자</h3><span id="onlineCount" class="small"></span></div><div id="online" class="list"></div><button class="danger" style="margin-top:12px" onclick="logout()">로그아웃</button></aside></div></section>
<section id="roomView" class="hidden"><div class="card"><div class="top"><div><button onclick="leaveRoom()">← 로비</button> <span id="roomTitle"></span></div><div id="hostControls"></div></div><div class="grid" style="grid-template-columns:220px 1fr 260px"><aside class="card"><h3>참가자</h3><div id="players" class="players"></div><p id="roomInfo" class="small"></p></aside><main class="card"><div id="gameArea"></div></main><aside class="card"><h3>💬 방 채팅</h3><div id="chat" class="chat"></div><input id="chatInput" placeholder="메시지 입력" onkeydown="if(event.key==='Enter')sendChat()"><button onclick="sendChat()">전송</button></aside></div></div></section></div>
<script>
const BASE='https://andy-5cb5e-default-rtdb.firebaseio.com/othello_platform';const ROOM='partyRooms';let me=null,data={users:{},partyRooms:{},partyPresence:{}};let roomId=null;let tick=null;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(){try{let r=await fetch(BASE+'.json'),v=await r.json();data={users:v?.users||{},partyRooms:v?.[ROOM]||{},partyPresence:v?.partyPresence||{}}}catch(e){console.error(e)}}async function put(path,v){let r=await fetch(BASE+'/'+path+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});return r.ok}
function show(id){['auth','lobby','roomView'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function name(id){return id==='andy212'?'관리자':id}
async function signup(){let id=$('id').value.trim(),pw=$('pw').value;if(!/^[a-zA-Z0-9가-힣_]{2,20}$/.test(id)||pw.length<4)return alert('아이디는 2~20자, 비밀번호는 4자 이상으로 입력하세요.');await get();if(data.users[id])return alert('이미 있는 아이디입니다.');await put('users/'+encodeURIComponent(id),{id,pw,email:'',joinedAt:Date.now(),lastActive:Date.now()});me={id,pw};enter()}
async function login(){let id=$('id').value.trim(),pw=$('pw').value;await get();let u=data.users[id];if(!u||u.pw!==pw)return alert('아이디 또는 비밀번호가 맞지 않습니다.');me={id,pw};enter()}
async function enter(){localStorage.partyUser=JSON.stringify(me);await heartbeat();show('lobby');render();if(tick)clearInterval(tick);tick=setInterval(async()=>{await heartbeat();await get();render()},2500)}
async function heartbeat(){if(!me)return;await put('partyPresence/'+encodeURIComponent(me.id),{id:me.id,lastActive:Date.now()});if(data.users[me.id])await put('users/'+encodeURIComponent(me.id)+'/lastActive',Date.now())}
async function logout(){await put('partyPresence/'+encodeURIComponent(me.id),null);localStorage.removeItem('partyUser');me=null;roomId=null;clearInterval(tick);show('auth')}
function active(){let n=Date.now();return Object.values(data.partyPresence||{}).filter(x=>x&&n-x.lastActive<15000)}
function render(){if(!me)return;$('who').textContent='👤 '+name(me.id);if(roomId&&data.partyRooms[roomId])renderRoom(data.partyRooms[roomId]);else{roomId=null;show('lobby');renderLobby()}}
function renderLobby(){let users=Object.values(data.users||{}).sort((a,b)=>(b.lastActive||0)-(a.lastActive||0));$('memberCount').textContent=users.length+'명';$('members').innerHTML=users.map(u=>`<div class="item">${active().some(a=>a.id===u.id)?'<span class="dot"></span>':'⚪ '}${esc(name(u.id))}</div>`).join('')||'<p class="small">회원이 없습니다.</p>';let on=active();$('onlineCount').textContent=on.length+'명';$('online').innerHTML=on.map(u=>`<div class="item online"><span class="dot"></span>${esc(name(u.id))}</div>`).join('')||'<p class="small">접속자가 없습니다.</p>';let rs=Object.entries(data.partyRooms||{}).filter(([,r])=>r.status!=='ended');$('rooms').innerHTML=rs.map(([id,r])=>`<div class="game"><b>${icon(r.type)} ${label(r.type)}</b><p class="small">${esc(r.title)}<br>${Object.keys(r.players||{}).length}/${limit(r.type)}명 · ${r.status==='waiting'?'대기 중':'진행 중'}</p><button ${r.status!=='waiting'?'disabled':''} onclick="joinRoom('${id}')">참가하기</button></div>`).join('')||'<div class="notice">아직 열린 방이 없어요. 첫 번째 방장이 되어 보세요!</div>'}
function icon(t){return t==='davinci'?'🧩':t==='mafia'?'🌙':'🕵️'}function label(t){return t==='davinci'?'다빈치 코드':t==='mafia'?'마피아':'라이어 게임'}function limit(t){return t==='davinci'?4:t==='mafia'?10:8}
async function createRoom(){let type=prompt('게임을 고르세요: davinci / mafia / liar','davinci');if(!['davinci','mafia','liar'].includes(type))return;let title=prompt('방 제목','즐거운 '+label(type)+' 방')||'파티 게임 방';let id='p'+Date.now();let r={id,title,type,host:me.id,status:'waiting',createdAt:Date.now(),players:{[me.id]:{id:me.id}},chat:[]};await put(ROOM+'/'+id,r);roomId=id;render()}
async function joinRoom(id){let r=data.partyRooms[id];if(!r||r.status!=='waiting')return alert('참가할 수 없는 방입니다.');if(Object.keys(r.players||{}).length>=limit(r.type))return alert('방이 가득 찼습니다.');r.players[me.id]={id:me.id};await put(ROOM+'/'+id,r);roomId=id;render()}
async function leaveRoom(){if(!roomId)return;let r=data.partyRooms[roomId];if(r?.players){delete r.players[me.id];if(!Object.keys(r.players).length)await put(ROOM+'/'+roomId,null);else{if(r.host===me.id)r.host=Object.keys(r.players)[0];await put(ROOM+'/'+roomId,r)}}roomId=null;render()}
async function start(){let r=data.partyRooms[roomId],ids=Object.keys(r.players||{}),min=r.type==='davinci'?2:r.type==='mafia'?4:3;if(ids.length<min)return alert(label(r.type)+'은 최소 '+min+'명이 필요합니다.');r.status='playing';r.chat.push({id:'system',text:'게임이 시작되었습니다!'});if(r.type==='davinci')r.game=davinci(ids);if(r.type==='mafia')r.game=mafia(ids);if(r.type==='liar')r.game=liar(ids);await put(ROOM+'/'+roomId,r)}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function davinci(ids){let deck=shuffle(Array.from({length:24},(_,i)=>(i%12<6?'🔴 ':'🔵 ')+(i%12)));let hands={};ids.forEach(id=>hands[id]=deck.splice(0,4).sort((a,b)=>Number(a.slice(3))-Number(b.slice(3))));return{turn:0,ids,hands,deck,revealed:{},log:['각자의 숫자 타일을 낮은 순서로 정렬하세요.']}}
function mafia(ids){let roles=shuffle(['마피아','마피아','의사','경찰',...Array(Math.max(0,ids.length-4)).fill('시민')]);let map={};ids.forEach((id,i)=>map[id]=roles[i]);return{ids,roles:map,phase:'night',round:1,votes:{},alive:ids,log:['밤이 되었습니다. 마피아는 조용히 목표를 고르세요.']}}
function liar(ids){let topics=shuffle(['비빔밥','제주도','아이돌 콘서트','피자','학교 급식','벚꽃놀이','축구','영화관']);return{ids,liar:ids[Math.floor(Math.random()*ids.length)],word:topics[0],round:1,clues:[],votes:{},phase:'clue'}}
function renderRoom(r){show('roomView');$('roomTitle').innerHTML=`<b>${icon(r.type)} ${esc(r.title)}</b> · ${label(r.type)}`;$('players').innerHTML=Object.keys(r.players||{}).map(id=>`<span class="player">${id===r.host?'👑 ':''}${esc(name(id))}</span>`).join('');$('roomInfo').textContent=`${Object.keys(r.players||{}).length}/${limit(r.type)}명 · ${r.status==='waiting'?'게임 시작을 기다리는 중':'게임 진행 중'}`;$('hostControls').innerHTML=r.host===me.id&&r.status==='waiting'?'<button class="gold" onclick="start()">게임 시작</button>':'';$('chat').innerHTML=(r.chat||[]).slice(-30).map(m=>`<p class="${m.id===me.id?'mine':''}"><b>${m.id==='system'?'📢':esc(name(m.id))}</b> ${esc(m.text)}</p>`).join('');$('chat').scrollTop=$('chat').scrollHeight;$('gameArea').innerHTML=r.status==='waiting'?'<div class="notice">참가자가 모이면 방장이 게임을 시작할 수 있어요.</div>':r.type==='davinci'?drawDavinci(r):r.type==='mafia'?drawMafia(r):drawLiar(r)}
function drawDavinci(r){let g=r.game,turn=g.ids[g.turn%g.ids.length],my=g.hands[me.id]||[];let opponents=g.ids.filter(id=>id!==me.id);return `<h2>🧩 다빈치 코드</h2><div class="notice">${turn===me.id?'당신의 차례입니다. 타일을 뽑거나 상대 숫자를 추리하세요.':name(turn)+'님의 차례입니다.'}</div><h3>내 타일</h3><div class="tiles">${my.map(x=>`<span class="tile ${x[0]==='🔴'?'red':'blue'}">${x}</span>`).join('')}</div><h3>상대 타일</h3>${opponents.map(id=>`<div class="notice"><b>${esc(name(id))}</b> ${g.hands[id].map((x,i)=>`<button class="tile ${x[0]==='🔴'?'red':'blue'}" onclick="guess('${id}',${i})">${g.revealed[id+'-'+i]||id===me.id?x:'?'}</button>`).join('')}</div>`).join('')}<div class="row"><button ${turn!==me.id||!g.deck.length?'disabled':''} onclick="drawTile()">타일 뽑기 (${g.deck.length})</button><button class="mint" ${turn!==me.id?'disabled':''} onclick="passTurn()">추리 안 함</button></div><p class="small">상대 타일을 눌러 숫자를 추리합니다. 맞히면 공개됩니다.</p>`}
async function drawTile(){let r=data.partyRooms[roomId],g=r.game;g.hands[me.id].push(g.deck.pop());g.hands[me.id].sort((a,b)=>Number(a.slice(3))-Number(b.slice(3)));await put(ROOM+'/'+roomId,r)}async function passTurn(){let r=data.partyRooms[roomId];r.game.turn=(r.game.turn+1)%r.game.ids.length;await put(ROOM+'/'+roomId,r)}
async function guess(id,i){let r=data.partyRooms[roomId],g=r.game,answer=prompt(name(id)+'님의 '+(i+1)+'번째 타일 숫자는? (0~11)');if(answer===null)return;let actual=String(g.hands[id][i]).match(/\d+/)[0];if(answer.trim()===actual){g.revealed[id+'-'+i]=g.hands[id][i];g.log.push(name(me.id)+'님이 정답을 맞혔습니다!');if(g.hands[id].every((_,n)=>g.revealed[id+'-'+n])){r.status='ended';g.log.push(name(id)+'님의 타일이 모두 공개되었습니다!')}else g.turn=(g.turn+1)%g.ids.length}else{g.log.push(name(me.id)+'님의 추리가 빗나갔습니다.');g.turn=(g.turn+1)%g.ids.length}await put(ROOM+'/'+roomId,r)}
function drawMafia(r){let g=r.game,role=g.roles[me.id];return `<h2>🌙 마피아</h2><div class="role">당신의 역할: <b>${role}</b><br><span class="small">${role==='마피아'?'동료와 눈빛으로 작전을 맞춰 보세요.':role==='경찰'?'밤에 한 명을 조사할 수 있습니다.':role==='의사'?'밤에 한 명을 보호할 수 있습니다.':'토론으로 마피아를 찾아내세요.'}</span></div><div class="notice">${g.round}라운드 · ${g.phase==='night'?'🌙 밤 — 비밀 행동 시간':'☀️ 낮 — 토론 후 용의자 투표 시간'}</div><h3>생존자</h3>${g.alive.map(id=>`<button class="vote" ${!g.alive.includes(me.id)?'disabled':''} onclick="mafiaVote('${id}')">${esc(name(id))}</button>`).join('')}<p class="small">${g.phase==='night'?'마피아는 제거할 사람, 의사는 보호할 사람, 경찰은 조사할 사람을 선택하세요. (현재는 방장이 다음 단계로 진행합니다.)':'가장 의심되는 사람에게 투표하세요.'}</p>${r.host===me.id?'<button class="gold" onclick="nextMafia()">다음 단계 ▶</button>':''}`}
async function mafiaVote(id){let r=data.partyRooms[roomId];r.game.votes[me.id]=id;await put(ROOM+'/'+roomId,r)}async function nextMafia(){let r=data.partyRooms[roomId],g=r.game;if(g.phase==='night'){g.phase='day';g.votes={};g.round++}else{let counts={};Object.values(g.votes).forEach(x=>counts[x]=(counts[x]||0)+1);let out=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];if(out){g.alive=g.alive.filter(x=>x!==out);g.log.push(name(out)+'님이 퇴장했습니다.')}g.phase='night';g.votes={}}await put(ROOM+'/'+roomId,r)}
function drawLiar(r){let g=r.game,isLiar=g.liar===me.id;return `<h2>🕵️ 라이어 게임</h2><div class="role">${isLiar?'당신은 라이어입니다 🤫':'제시어: <b>'+esc(g.word)+'</b>'}<br><span class="small">${isLiar?'제시어를 모른 채, 다른 사람의 힌트로 정체를 숨기세요.':'제시어를 직접 말하지 말고 자연스러운 힌트를 남기세요.'}</span></div><div class="notice">${g.phase==='clue'?'한 사람씩 힌트를 남긴 뒤 라이어를 찾아 투표하세요.':'투표 시간! 가장 수상한 사람을 고르세요.'}</div><div>${g.clues.map(c=>`<div class="clue"><b>${esc(name(c.id))}</b> · ${esc(c.text)}</div>`).join('')}</div>${g.phase==='clue'?`<textarea id="clue" placeholder="제시어를 직접 말하지 않는 힌트"></textarea><button onclick="addClue()">힌트 남기기</button>${r.host===me.id?'<button class="gold" onclick="openVote()">투표 시작</button>':''}`:`<div class="players">${g.ids.map(id=>`<button onclick="liarVote('${id}')">${esc(name(id))}</button>`).join('')}</div>${r.host===me.id?'<button class="gold" onclick="finishLiar()">결과 공개</button>':''}`}`}
async function addClue(){let text=$('clue').value.trim();if(!text)return;let r=data.partyRooms[roomId];if(r.game.clues.some(c=>c.id===me.id))return alert('힌트는 한 번만 남길 수 있어요.');r.game.clues.push({id:me.id,text});await put(ROOM+'/'+roomId,r)}async function openVote(){let r=data.partyRooms[roomId];r.game.phase='vote';await put(ROOM+'/'+roomId,r)}async function liarVote(id){let r=data.partyRooms[roomId];r.game.votes[me.id]=id;await put(ROOM+'/'+roomId,r)}async function finishLiar(){let r=data.partyRooms[roomId],g=r.game,c={};Object.values(g.votes).forEach(x=>c[x]=(c[x]||0)+1);let picked=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];r.chat.push({id:'system',text:'라이어는 '+name(g.liar)+'님! '+(picked===g.liar?'정체를 밝혀냈습니다! 🎉':'라이어가 살아남았습니다! 😈')});r.status='ended';await put(ROOM+'/'+roomId,r)}
async function sendChat(){let t=$('chatInput').value.trim();if(!t||!roomId)return;$('chatInput').value='';let r=data.partyRooms[roomId];r.chat=r.chat||[];r.chat.push({id:me.id,text:t,time:Date.now()});r.chat=r.chat.slice(-50);await put(ROOM+'/'+roomId,r)}
window.addEventListener('beforeunload',()=>{if(me)fetch(BASE+'/partyPresence/'+encodeURIComponent(me.id)+'.json',{method:'PUT',body:'null',keepalive:true})});(async()=>{let saved=localStorage.partyUser;if(saved){me=JSON.parse(saved);await enter()}else show('auth')})();
</script></body></html>
